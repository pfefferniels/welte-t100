  # -- the flow law, and the constants the simulation runs on -------------------
  #
  # Generated from `emulator/docs/fit-pneumatic.json` so that no number is transcribed by
  # hand. Each is a belief of the project's, held relative to the fitting logic named on it;
  # `kg/view/` reads exactly these to run the schematic, so every quantity on that page can
  # be followed back to this file and from here to the roll observations underneath it.

  # The flow law, dx/dt = Σ g_i · a_i · sign(T_i − x) · |T_i − x|^α, as three propositions:
  # the model selects rates, the paths superpose, and each path slows towards its target.
  # `g_i` is the path's conductance and `a_i` how far its valve is open; `T_i` is its target.
  # At α = 0 the family contains midi2exp's constant rate as a special case, which is why the
  # exponent is fitted rather than chosen. The law is what makes the three states of the
  # mechanism a single equation, and it is what the schematic integrates.

  - id: flow-law
    kind: inference
    locator: "emulator/src/model/pneumatic.ts:10-18"
    subject: model-pneumatic
    property: speed-over-the-stroke
    object: approaches-a-target
    holds: TRUE
    premises: [roll-3309-observations/constant-rate-is-rejected]
    logic: differential-evolution-then-simplex
    mentions: [kondukte-39, kondukte-23, bohrung-100, drossel-96, nuancierbalg-90]
    note: >
      Each path pulls towards its own target and slows as the bellows approaches it, with
      the exponent α saying how. The same answer the roll gives to Phillips's second
      assumption.

  - id: paths-superpose
    kind: inference
    locator: "emulator/src/model/pneumatic.ts:10-18"
    subject: model-pneumatic
    property: combining-law
    object: additive
    holds: TRUE
    premises: [roll-3309-observations/crescendo-latch-speeds-the-sforzando]
    logic: differential-evolution-then-simplex
    note: >
      The velocity is the sum of the flows through the paths currently open. Roll 3309 says
      the two ports cannot be modelled as alternatives, and the sum accounts for about two
      thirds of the gap it measures between a sforzando with and without the crescendo latch.

  - id: model-selects-rates
    kind: inference
    locator: "emulator/src/model/pneumatic.ts:10-18"
    subject: model-pneumatic
    property: control-principle
    object: rates-not-levels
    holds: TRUE
    premises: [roll-3309-observations/constant-rate-is-rejected, gottschewski-1996/rates-not-steps]
    logic: differential-evolution-then-simplex
    note: >
      The control tracks select conductances, and the level is whatever the integration of
      those conductances produces.

  - id: model-stands-for-the-nuancierbalg
    kind: report
    locator: "emulator/src/model/pneumatic.ts:1-10"
    subject: model-pneumatic
    property: models
    object: nuancierbalg-90
    scope: welte-t100
    holds: TRUE
    note: >
      The state x is the closure of the nuance bellows: 0 fully open, 1 fully closed.

  - id: model-is-fitted-to-the-line
    kind: report
    locator: "emulator/docs/fit-pneumatic.json"
    subject: model-pneumatic
    property: derives-from
    object: drawn-line-3309
    holds: TRUE
    note: >
      Every constant below is what this line put at that coordinate, so the model shows the
      line's features and no other roll's.

  - id: model-is-defined-in-the-emulator
    kind: report
    locator: "emulator/src/model/pneumatic.ts"
    subject: model-pneumatic
    property: defined-in
    object: emulator-source
    holds: TRUE

  - id: valve-times-ignore-the-suction
    kind: observation
    locator: "emulator/src/model/pneumatic.ts, valve charge and bleed terms"
    subject: model-pneumatic
    property: on-time-against-suction
    object: independent-of-suction
    holds: TRUE
    note: >
      The valve constants do not depend on the current stack vacuum, so an expression pulse
      buys the same open time whether the instrument is at the piano rail or at the
      fortissimo one. Phillips reports the opposite from the bench, which is a named
      candidate for what a fitted valve constant may be absorbing.

  - id: aperture-outlasts-the-punch
    kind: observation
    locator: "emulator/src/roll/aperture.ts:1-40"
    subject: model-pneumatic
    property: effective-perforation-length
    object: longer-than-punched
    holds: TRUE
    note: >
      The open area is the lens where the punched hole and the tracker-bar bore overlap, so
      the port opens before the hole's leading edge reaches the bore's centre and closes
      after its trailing edge has passed it. The same phenomenon midi2exp handles by
      extending every hole's tail, placed about 11 ms earlier in total.

