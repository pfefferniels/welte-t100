# The emulator's own constants, recorded as beliefs relative to a stated fitting logic.
#
# This is the file that keeps the project honest about its own numbers. A fitted constant
# is not a measurement: it is what a particular objective, on a particular roll, with a
# particular set of other terms free, put at that coordinate. When the model around it is
# reshaped it moves, sometimes a long way, and the graph should show that rather than hide
# it behind a single authoritative value.

source:
  id: emulator-fit
  kind: fitting-record
  title: "The pneumatic model fitted to roll 3309"
  authors: [pfeffer-niels]
  container: "emulator/docs/experiments.md; emulator/src/cli/settings.ts"
  year: 2026
  note: >
    Fits are scored held out, on alternating eight-second blocks rather than a time cut,
    because the model carries roll-length state. Differences below about 0.005 are the search
    and not the model: the ablation's rows are one fit of 220 generations from one seed, and
    rows that should be near-identical land several thousandths apart.

statements:

  # -- the constants the roll cannot decide, pinned from outside ---------------

  - id: mf-flag-is-output-neutral
    kind: observation
    locator: "emulator/src/cli/settings.ts:38-49"
    subject: parameter-mf-two-sided
    property: parameter-value
    value: 1
    unit: dimensionless
    holds: TRUE
    note: >
      Over the whole range of the flag the output does not move by one part in 1e15. The two
      readings part company only where the hook engages with the line below the pin and the
      line then rises into it, and on this roll that case never occurs. So the fitted value
      carried no information and the search was spending a dimension on it.

  - id: mf-two-sided-is-pinned-from-welte
    kind: inference
    locator: "emulator/src/cli/settings.ts:38-49"
    subject: parameter-mf-two-sided
    property: blocks-in-directions
    object: both-directions
    holds: TRUE
    premises:
      - mf-flag-is-output-neutral
      - hagemann-2001/mf-hook-blocks-both-ways
      - hagmann-1984/mezzoforte-pin-halfway
      - roll-3309-observations/hook-holds-in-both-directions-untestable
    logic: citation-settles-what-the-roll-cannot
    note: >
      The worked example of the whole graph. The roll is silent, so fitting would report
      noise; two independent witnesses say the pin blocks both ways — Welte, quoted by
      Hagemann, about what can sound, and Hagmann, about what the pin does to the bellows —
      and the constant is therefore pinned from the citation rather than fitted. If either
      reading is later withdrawn, this inference is what has to be revisited, and the graph
      says so.

  - id: sforzando-latch-flag-is-off
    kind: inference
    locator: "emulator/src/cli/settings.ts:50-58, SETTLED"
    subject: parameter-sforzando-latches
    property: parameter-value
    value: 0
    unit: dimensionless
    holds: TRUE
    premises:
      - roll-3309-observations/sforzando-latch-withdrawn
      - welte-anhang-12/control-4b-six-steps
      - welte-anhang-12/control-6b-automatic-decrescendo
    logic: citation-settles-what-the-roll-cannot
    note: >
      The sforzando acts per pulse. The roll leans that way without settling it, and Welte's
      own controls say it four times over, against Hagmann's latch. If the latch reading is
      ever confirmed on an instrument, this is the constant that has to move.

  - id: sforzando-coupling-flag-is-off
    kind: inference
    locator: "emulator/src/cli/settings.ts:50-58, SETTLED"
    subject: parameter-sforzando-sets-crescendo
    property: parameter-value
    value: 0
    unit: dimensionless
    holds: TRUE
    premises:
      - roll-3309-observations/no-sforzando-crescendo-coupling-in-the-punching
      - roll-3309-observations/crescendo-latch-speeds-the-sforzando
    logic: counting-argument-on-the-punching
    note: >
      The roll does not couple the sforzando to the crescendo in its punching, and it shows
      two rates for a sforzando with and without the crescendo latch where a coupled relay
      would show one. Hagmann's Parallelschaltung is therefore not supplied by the model.

  - id: mf-barrier-flag-is-on
    kind: inference
    locator: "emulator/src/cli/settings.ts:50-58, SETTLED"
    subject: parameter-mf-barrier
    property: parameter-value
    value: 1
    unit: dimensionless
    holds: TRUE
    premises:
      - hagmann-1984/pin-arrests-the-bellows
      - hagemann-2001/mf-hook-blocks-both-ways
      - roll-3309-observations/hook-arrest-bass
    logic: citation-settles-what-the-roll-cannot
    note: >
      The Mezzoforte pin is in the path and arrests the bellows, which the roll shows
      twenty-two times and both Hagmann and Welte describe.

  - id: mf-thickness-is-stipulated
    kind: convention
    locator: "emulator/src/cli/settings.ts:67-77"
    subject: parameter-mf-thickness
    property: parameter-value
    value: 0.06
    unit: travel-fraction
    note: >
      Recorded as a stipulation and not as a belief, because the source file says so itself:
      only the pin's lower face is observable on this roll, fitting the thickness moves a
      face nothing touches, and the output is identical to the last bit over the whole range
      0 to 0.3. The value keeps the 0.06 an earlier reading used, so that the measured hook
      level still carries the one observable quantity as `mezzoforte − mfThickness / 2`. The
      pin's real thickness wants an instrument.

  # -- the flow law, and three different published values of its exponent ------

  - id: alpha-readme
    kind: inference
    locator: "emulator/README.md:83-84"
    subject: model-pneumatic
    property: flow-exponent
    value: 1.02
    unit: dimensionless
    holds: TRUE
    premises: [roll-3309-observations/constant-rate-is-rejected]
    logic: differential-evolution-then-simplex
    note: >
      α = 1 is a laminar throttle and gives exponential approach; α = ½ an orifice; α = 0 the
      constant rate midi2exp assumes. The exponent is fitted rather than chosen, and the
      family contains midi2exp as a special case.

  - id: alpha-ablation
    kind: inference
    locator: "emulator/docs/experiments.md:74"
    subject: model-pneumatic
    property: flow-exponent
    lower: 0.6668
    upper: 0.757
    unit: dimensionless
    holds: TRUE
    premises: [roll-3309-observations/constant-rate-is-rejected]
    logic: ablation-refit
    contradicts: [alpha-readme]
    note: >
      The unrestricted fit in the ablation table, bass and treble. Recorded because it does
      not agree with the README's 1.02 and because both are in the repository at once.

  - id: alpha-headline-fit
    kind: inference
    locator: "emulator/docs/fit-pneumatic.json"
    subject: model-pneumatic
    property: flow-exponent
    lower: 1.385
    upper: 1.518
    unit: dimensionless
    holds: TRUE
    premises: [roll-3309-observations/constant-rate-is-rejected]
    logic: differential-evolution-then-simplex
    contradicts: [alpha-readme, alpha-ablation]
    note: >
      Three values of the same exponent are in the repository simultaneously — 1.02 in the
      README, 0.67 to 0.76 in the ablation, 1.39 to 1.52 in the headline fit — under three
      different fitting conditions. None of them is wrong; what is wrong is quoting any one
      of them as "the" exponent. This is exactly what the graph exists to make visible, and
      it was found by building it rather than by reading the documents.

