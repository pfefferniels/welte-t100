    value: 0.0340
    unit: scale-unit
    holds: FALSE
    when: "2026-08"
    premises: [pneumatic-error-bass]
    logic: differential-evolution-then-simplex
    note: >
      Withdrawn. 0.0340 and 0.0421 are the model's current error on the *rest* of the roll,
      which is a different quantity from the floor the unaccountable windows impose.

  - id: floor-corrected
    kind: inference
    locator: "emulator/docs/empirics.md §14; commit 6152b5d"
    subject: model-pneumatic
    property: irreducible-error-bass
    value: 0.0199
    unit: scale-unit
    holds: TRUE
    premises: [floor-earlier-reading, unaccountable-windows]
    logic: differential-evolution-then-simplex
    supersedes: [floor-earlier-reading]
    note: >
      0.0199 in the bass and 0.0312 in the treble. That is where a model perfect on every
      other row would still score, and it is the number to stop optimising below.

  - id: unaccountable-windows
    kind: observation
    locator: "emulator/docs/empirics.md §14"
    subject: drawn-line-3309-treble
    property: share-of-squared-error
    lower: 25.7
    upper: 35.9
    unit: percent
    holds: TRUE
    note: >
      Four windows a half carry 25.7 % and 35.9 % of the squared error on 1.2 % and 1.8 % of
      the rows. Two of them are sforzando cancels whose punched code is indistinguishable
      from cancels the model gets right: both ports open fully, open area 80 ms against a
      population median of 82 and 80, length 105 ms, and the drawn line behaves completely
      differently. A valve stuck by disuse does not explain them either — the peak fall rate
      correlates with the idle time before the cancel at r = 0.17 and 0.26, and positively,
      which is the wrong sign. So the same punch, in the same state, produced a quite
      different result once.

  - id: robust-loss-recovers-the-treble
    kind: inference
    locator: "commit 95e19a7; emulator/docs/experiments.md"
    subject: model-pneumatic
    property: held-out-error-treble
    value: 0.0351
    unit: scale-unit
    holds: TRUE
    premises: [unaccountable-windows, pneumatic-error-treble]
    logic: differential-evolution-then-simplex
    note: >
      Charging residuals past δ = 0.06 linearly while fitting, and scoring on plain RMSE,
      takes the treble from 0.0393 to 0.0351 held out and costs the bass 0.0006. Because the
      four treble episodes are irreducible, letting them into a squared objective drags the
      constants; the bass, which has no such episodes, pays a little for discarding good
      information. Recorded as a separate belief from `pneumatic-error-treble` rather than
      replacing it, because the two are results under different objectives.

