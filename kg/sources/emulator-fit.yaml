  # -- a disagreement inside one file ------------------------------------------

  - id: stop-header-says-upper-face
    kind: report
    locator: "emulator/src/model/stop.ts:1-21, file header"
    quote:
      en: "a board descending onto it comes to rest against its upper face, a board rising onto it against its lower face"
    subject: mezzofortebalg-93
    property: hook-arrest-face
    object: upper-face
    holds: FALSE
    adopt: false
    contradicts: [stop-code-uses-lower-face]
    note: >
      Held FALSE because the same file's code does the opposite, and because the arithmetic
      in `settings.ts` — the measured falling rest plus half a thickness to give the centre —
      only works on the other reading. Recorded rather than quietly corrected: the header is
      what a reader of that file meets first, and it has been wrong for as long as it has
      been there.

  - id: stop-code-uses-lower-face
    kind: report
    locator: "emulator/src/model/stop.ts, limitAtStop"
    quote:
      en: "return state.trappedAbove ? Math.max(moved, lower) : Math.min(moved, upper);"
    subject: mezzofortebalg-93
    property: hook-arrest-face
    object: lower-face
    holds: TRUE
    adopt: true
    mentions: [drawn-line-3309-bass]
    note: >
      A bellows confined above the pin has the lower face as its floor, so a line falling
      from the fortissimo rail rests there. That is what makes the measured 0.5752 in the
      bass the lower face and the centre 0.03 above it, which is exactly what `settings.ts`
      computes. Which side the bellows is confined to is decided once, when the hook
      engages, and does not flip while it stays engaged — a hysteresis rather than an
      excluded band. The schematic follows this, not the header.
