  # -- the latch, which is the contested claim ---------------------------------

  - id: sforzando-on-latches
    kind: report
    locator: "pp. 99–100"
    quote:
      de: "Sforzando: In gleicher Weise arbeitet das (einfache) Ventil 22, dessen über die Linie 12 (Sforzando an) des Gleitblocks erzeugte Oeffnung die rasche Evakuation des Nuancierbalgs bewirkt … Und auch hier wird die Funktion aufrecht erhalten, selbst wenn die entsprechende Perforation verschwindet"
    translation: >
      Sforzando: valve 22, a simple one, works in the same way; its opening, produced over
      line 12 (Sforzando on) of the glide block, brings about the rapid evacuation of the
      Nuancierbalg … And here too the function is maintained even when the corresponding
      perforation disappears.
    subject: function-sforzando-on
    property: latching-behaviour
    object: latches
    scope: welte-t100
    holds: TRUE
    adopt: false
    note: >
      The largest single disagreement in the whole graph. Hagmann is unambiguous; Welte's
      own Anhang 12 says per pulse four times over; Gottschewski's account of the track
      functions is incompatible with a latch; midi2exp and pianolatron implement momentary;
      and roll 3309 cannot settle it but leans momentary. Not adopted here.

  - id: mezzoforte-latches-like-the-others
    kind: report
    locator: "p. 100"
    quote:
      de: "Mezzoforte: Ebenfalls in gleicher Weise wie bei der Crescendo-Funktion arbeitet das Doppelventil 53 … Auch im Bezug auf Aufrechterhaltung und Auslösung der Funktion ergeben sich keinerlei Differenzen."
    subject: function-mezzoforte-on
    property: latching-behaviour
    object: latches
    scope: welte-t100
    holds: TRUE
    adopt: true
    note: >
      Adopted where the sforzando claim is not, because the roll agrees: every one of the
      twenty-two mezzoforte engagements on 3309 persists long after its punch has passed.

  - id: sforzando-couples-to-crescendo
    kind: report
    locator: "p. 100, with note 33"
    quote:
      de: "dennoch wird mit der Position „Sforzando“ stets auch die Position „Crescendo“ eingegeben, sodass hier der Nuancierbalg auch über die Crescendo-Kondukte 39 in geschlossener Stellung gehalten wird"
    subject: function-sforzando-on
    property: sets-also
    object: function-crescendo-on
    scope: welte-t100
    holds: TRUE
    adopt: false
    note: >
      Hagmann's own footnote 33 to this sentence reads, in full, "Gründe für diese
      Parallelschaltung sind nicht bekannt." Roll 3309 says the coupling is not in the
      punching: sforzando and crescendo punches co-occur no more often than chance, and the
      on-pair slightly less often. Whether the relay supplies it cannot be tested from a
      roll.

  # -- the T-98, which is where the same formula appears negated ---------------

  - id: t98-sforzando-is-momentary
    kind: report
    locator: "pp. 102–103"
    quote:
      de: "Ueber die Oeffnung 67 des Gleitblocks kann also nur die rasche Zunahme der Lautstärke eingegeben werden, denn nach dem Verschwinden der Perforation über der Oeffnung 67 greift die Decrescendo-Wirkung von Oeffnung 66 Platz"
    subject: t98-function-sforzando
    property: latching-behaviour
    object: momentary
    scope: welte-t98
    holds: TRUE
    adopt: true

  - id: t98-mezzoforte-is-momentary
    kind: report
    locator: "p. 103"
    quote:
      de: "Und auch hier wird die Funktion nur solange aufrecht erhalten, als die Perforation auf dem Notenband andauert; verschwindet sie, so führt sich der Vorgang von selbst in seine Ausgangsposition zurück."
    translation: >
      And here too the function is maintained only as long as the perforation on the roll
      lasts; when it disappears, the process returns of its own accord to its starting
      position.
    subject: t98-function-mezzoforte
    property: latching-behaviour
    object: momentary
    scope: welte-t98
    holds: TRUE
    adopt: true
    note: >
      Read alongside `sforzando-on-latches`. Hagmann uses the same formula — "auch hier wird
      die Funktion … aufrecht erhalten" — for both scales, and negates it for the T-98:
      "nur solange … als die Perforation andauert" against "selbst wenn die entsprechende
      Perforation verschwindet". Whatever else is true, the T-100 claim is not a loose
      generalisation that slipped past him. He is contrasting the two scales on exactly this
      point, in parallel sentences four pages apart.

  # -- what the book does not contain ------------------------------------------

  - id: no-vacuum-figure-for-the-piano
    kind: report
    locator: "searched throughout; the one figure is at p. 72"
    holder: pfeffer-niels
    subject: hagmann-1984-book
    property: contains-a-figure-for
    object: not-stated
    holds: TRUE
    note: >
      There is no vacuum figure for the piano anywhere in the book, and no timing in seconds
      or milliseconds for any nuancing movement. Every timing is defined relative to the
      roll by marker tones punched at fixed distances. The single vacuum figure in the book,
      28 mbar or 280 mm water column at p. 72, is the magazine bellows of the Meidinger
      blower of the Seewen Welte-Philharmonie **organ**, alongside 8 mbar for Manual I and
      pedal wind and 9 mbar for Manual II. It is not a piano figure and must not be carried
      over.

  - id: plates-are-schematic
    kind: report
    locator: "p. 62, note 29"
    quote:
      de: "Die Skizzen geben die pneumatischen Einrichtungen nicht in ihrer tatsächlichen Anordnung wieder, sondern verstehen sich als schematische Darstellungen."
    subject: anhang-13
    property: drawing-fidelity
    object: schematic-not-to-scale
    holds: TRUE
    adopt: true
    note: >
      Hagmann's own disclaimer, said of all the plates, and the reason no dimension may be
      taken off any of them. It is quoted here rather than in the Anhang 13 source file
      because it is his statement, not a reading of the drawing.

  - id: recording-procedure-undocumented
    kind: report
    locator: "p. 70, note 48"
    quote:
      de: "Wie die Einzelheiten des Aufnahmeverfahrens verschwiegen wurden, sind auch Aeusserungen dazu bis heute nicht bekannt geworden."
    translation: >
      Just as the details of the recording procedure were kept secret, no statements about
      it have become known to this day.
    subject: welte-recording-process
    property: attested-in-the-literature
    object: not-attested
    holds: TRUE
    adopt: true
    note: >
      This is why what the drawn line on roll 3309 records cannot be settled from the
      literature and has to be settled from the roll. Gottschewski says at p. 41,
      independently, that no recording rolls survive either.

