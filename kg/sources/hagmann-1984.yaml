    subject: gleitblock-opening-12
    property: controls-function
    object: function-sforzando-on
    scope: welte-t100
    holds: TRUE
    adopt: true
    mentions: [gleitblock]

  - id: opening-7-releases-the-mezzoforte-latch
    kind: inference
    locator: "p. 100"
    quote:
      de: "Auch im Bezug auf Aufrechterhaltung und Auslösung der Funktion ergeben sich keinerlei Differenzen."
    holder: pfeffer-niels
    subject: gleitblock-opening-7
    property: releases-latch
    object: doppelventil-53
    scope: welte-t100
    holds: PROBABLE
    premises:
      - opening-7-inputs-mezzoforte-off
      - mezzoforte-latches-like-the-others
      - valve-47-releases-the-latch
    logic: composition-of-stated-mechanisms
    note: >
      Hagmann says the maintaining and the releasing of Mezzoforte work exactly as they do
      for the crescendo, where the release runs from opening 9 through membrane chamber 44
      and double valve 47 to the latch chamber 41. The mezzoforte side must have the same
      three parts, but he numbers none of them: he describes only the setting valve 53.
      Held PROBABLE, and drawn as one link rather than three invented ones, because the
      intermediate chamber and valve are not in the source and should not be in the picture.
