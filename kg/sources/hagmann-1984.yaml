  - id: chamber-17-pushes-valve-38-down
    kind: report
    locator: "p. 99"
    quote:
      de: "sodass der aus der Windkammer 17 einwirkende Luftdruck das Doppelventil 38 wieder nach unten stossen kann, weshalb sich die Ventilkammer 38 wieder mit Luft füllt, die über die Kondukte 39 in den Nuancierbalg dringt und dessen Oeffnung bewirkt"
    translation: >
      so that the air pressure acting from wind chamber 17 can push double valve 38 down
      again, whereupon valve chamber 38 fills with air once more, which passes through
      conduit 39 into the Nuancierbalg and brings about its opening.
    subject: windkammer-17
    property: admits-air-to
    object: doppelventil-38
    scope: welte-t100
    holds: TRUE
    adopt: true
    note: >
      Valve chamber 38 is connected to one of two things and never to both: to wind chamber
      17, which the bores 16 hold at atmospheric pressure, while the valve is down; and to
      wind chamber 15, the blower's vacuum, while membrane 36 holds it up. So the air that
      reopens the Nuancierbalg through conduit 39 is ordinary room air arriving through 17,
      and the same conduit 39 empties the bellows when the valve lifts and 15 takes over.
      One conduit, two sources, switched by the valve — which is why the crescendo relay has
      a double valve and not a simple one.

