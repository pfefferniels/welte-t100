  - id: the-system-works-by-suction
    kind: report
    locator: "p. 66"
    quote:
      de: "Der Wiedergabe-Mechanismus ist als abgeschlossenes System konzipiert, aus dem eine Gebläse-Einrichtung die Luft abzieht. In der verdünnten Atmosphäre des Systems kann nun Normaldruck, der über die Steuerungselemente in das System eingelassen wird, als Bewegungsauslöser wirksam werden."
    translation: >
      The reproducing mechanism is conceived as a closed system out of which a blower draws
      the air. In the thinned atmosphere of the system, ordinary pressure, let into the
      system through the control elements, can then act as what sets things in motion.
    subject: welte-t100
    property: control-principle
    object: suction-system
    holds: TRUE
    adopt: true
    mentions: [geblaese, windkammer-15, windkammer-17, gleitblock]
    note: >
      Hagmann adds that suction pneumatics were chosen over pressure because they work less
      sluggishly and allow faster and more precise movement. Two things follow for any
      drawing of the mechanism. Air on a suction line travels towards the blower, which is
      the opposite of the direction in which the causation is normally described. And a
      perforation does not send a signal: it opens a hole through which the outside
      atmosphere enters, and that inrush is the whole of the actuation.

  - id: conduit-54-refills-the-mf-bellows
    kind: inference
    locator: "p. 100"
    quote:
      de: "Ebenfalls in gleicher Weise wie bei der Crescendo-Funktion arbeitet das Doppelventil 53 … Auch im Bezug auf Aufrechterhaltung und Auslösung der Funktion ergeben sich keinerlei Differenzen."
    holder: pfeffer-niels
    subject: doppelventil-53
    property: admits-air-to
    object: mezzofortebalg-93
    mentions: [kondukte-54, windkammer-17]
    scope: welte-t100
    holds: PROBABLE
    premises:
      - valve-53-evacuates-the-mf-bellows
      - valve-38-admits-air-to-the-bellows
      - mezzoforte-latches-like-the-others
    logic: composition-of-stated-mechanisms
    note: >
      The mezzoforte relay is a double valve working, in Hagmann's words, exactly as the
      crescendo one does. On the crescendo side the one conduit 39 does both jobs: it empties
      the Nuancierbalg while the valve is up and refills it from wind chamber 17 when the
      valve falls. Conduit 54 should do the same for the Mezzofortebalg, which is what
      withdraws the hook when Mezzoforte is cancelled.

      Held PROBABLE and not TRUE. Hagmann's "keinerlei Differenzen" is said of the
      maintaining and the releasing of the function, not in so many words of the refill path,
      and he never traces conduit 54 in the direction of air. Without this link the drawing
      has the hook going in and never coming out, which is why the gap was noticed at all.

