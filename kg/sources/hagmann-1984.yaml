  - id: widerstand-is-blower-two-speed
    kind: report
    locator: "pp. 73–75, with Anhang 10"
    subject: function-widerstand-on
    property: controls-function
    object: blower-two-speed-resistance
    scope: welte-t100
    holds: TRUE
    adopt: true
    note: >
      Bass lines 9 and 10, "Widerstand ab / an", switch the blower motor between its two
      speeds. On the T-98 this was replaced by an automatic pressure-equalising valve, and
      Hagmann expects that to flatten accents on the green rolls relative to the red ones.
      So it is a second, independent global loudness input on the T-100, with nothing to do
      with the Nuancierbalg. Both open-source emulators read these two lines as the
      transport motor switch instead.

