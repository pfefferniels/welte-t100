    kind: report
    locator: "pp. 97–98, with note 27"
    quote:
      de: "wobei der Informationseingabe jeweils deren Negation zugeordnet ist, die auf dem Gleitblock aus Gründen der technischen Zuverlässigkeit der Informationseingabe vorausgeht"
    translation: >
      each information input having its negation assigned to it, which on the glide block
      precedes the input, for reasons of the technical reliability of the input.
    subject: gleitblock-opening-7
    property: lies-outboard-of
    object: gleitblock-opening-8
    scope: welte-t100
    holds: TRUE
    adopt: true

