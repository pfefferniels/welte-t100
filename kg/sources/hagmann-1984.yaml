  # -- the blower's reservoir ---------------------------------------------------

  - id: blower-evacuates-the-reservoir
    kind: report
    locator: "p. 73"
    quote:
      de: "Vier konzentrisch angeordnete Schöpfbälge (S) sind über einen Riemen (R) und eine exzentrische Kurbel (K), die sie nacheinander öffnet und wieder schliesst, mit dem Elektromotor verbunden und evakuieren den Magazinbalg, über den die Luft aus dem System abgezogen wird."
    subject: geblaese
    property: evacuates
    object: magazinbalg
    scope: welte-t100
    holds: TRUE
    adopt: true
    note: >
      The air of the whole reproduction system is drawn out through the magazine bellows, so
      it sits on the trunk and not beside it. Its job is to match the constant output of the
      blower to the changing demand of a roll being played.

  - id: reservoir-sets-the-fortissimo
    kind: report
    locator: "p. 73"
    quote:
      de: "Entscheidend ist dabei, dass die Kraft der Balgfeder und die Einstellung des Sicherheitsventils die Stärke des Fortissimo-Anschlags bestimmen: Je später das Sicherheitsventil betätigt, je mehr also der Magazinbalg zugesaugt wird, desto stärker …"
    subject: magazinbalg
    property: acts-on
    object: state-fortissimo
    scope: welte-t100
    holds: TRUE
    adopt: true
    note: >
      Two consequences the model has to live with. The supply is regulated only
      asymmetrically — the spring is a finite buffer against too little vacuum, "kurzfristig"
      twice over in Hagmann's wording, while the safety valve is a hard clamp against too
      much. And the regulation has droop: the deeper the magazine bellows is drawn in, the
      more the spring tells, so the regulated vacuum is a function of how far it has closed
      and not a constant.

  - id: chamber-44-lifts-valve-47
