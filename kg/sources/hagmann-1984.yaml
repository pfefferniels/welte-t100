    subject: ledermutter-92
    property: norms-state
    object: state-piano
    scope: welte-t100
    holds: TRUE
    adopt: true
    note: >
      The nut sets what the fully open Nuancierbalg delivers, which is the pianissimo end of
      the range, and balances bass against treble there. Hagemann sets his Piano at "the two
      leather nuts" and Brougher his first intensity at "leather nut A", which are the same
      adjustment described three times.

  # -- the four flow paths -----------------------------------------------------

  - id: conduit-23-wider-than-39
    kind: report
    locator: "pp. 99–100"
    quote:
      de: "der mit der Ventilkammer 22 über die im Vergleich zur Kondukte 39 breiter dimensionierte Kondukte 23 verbunden ist"
    subject: kondukte-23
    property: wider-than
    object: kondukte-39
    scope: welte-t100
    holds: TRUE
    adopt: true
    note: >
      The only relative-size information in the whole book, and it is verbal. Conduit 39 is
      called "mittelbreit" elsewhere. No bore is given a dimension anywhere, and none can be
      recovered from the plates.

  - id: opening-should-take-as-long-as-closing
    kind: report
    locator: "p. 99, with note 31 (Skalarolle Kontrolle 3)"
    quote:
      de: "Da über die Kondukte 39 jedoch zu wenig Luft einzuströmen vermag, um die Oeffnung des Nuancierbalgs in derselben zeitlichen Ausdehnung zu ermöglichen, wie für dessen vollständige Schliessung im Rahmen der Crescendo-Bewegung benötigt wird, ist die zusätzliche, mit einer Drossel versehene Bohrung 100 dafür vorgesehen, jenes Manko an Luftzufuhr auszugleichen."
    translation: >
      Since too little air can flow in through conduit 39 to allow the Nuancierbalg to open
      in the same elapsed time as its complete closing requires within the crescendo
      movement, the additional throttled bore 100 is provided to make up that shortfall of
      air supply.
    subject: bohrung-100
    property: opening-closing-symmetry
    object: designed-symmetric
    scope: welte-t100
    holds: TRUE
    adopt: true
    comprehension: >
      The design target is stated in the subordinate clause: opening should take the same
      elapsed time as full closing, and bore 100 exists because conduit 39 alone cannot
      deliver it. That is a statement about durations, not about rates, which matters
      because the two directions relax towards different asymptotes and so have quite
      different time constants while still crossing the span in comparable times.

  - id: sforzando-pair-designed-symmetric
    kind: report
    locator: "p. 100, with note 34 (Skalarolle Kontrollen 4 und 6)"
    quote:
      de: "Der Balg 94 öffnet die Drossel 96, durch die, ist sie korrekt eingestellt, jene Menge Luft einströmt, die zur Oeffnung des Nuancierbalgs 90 in derselben Zeit notwendig ist, wie für seine durch die Betätigung des Sforzando-Ventils erfolgte Schliessung benötigt wird"
    subject: drossel-96
    property: opening-closing-symmetry
    object: designed-symmetric
    scope: welte-t100
    holds: TRUE
    adopt: true
    note: >
      Both pairs are meant to be mirror images in duration, and the sforzando pair is faster
      than the crescendo pair. Hagmann gives no ratio between them. Roll 3309 says the
      sforzando pair is emphatically not symmetric: the fall is 3.9 to 4.3 times the rise.

  - id: throttle-97-bypasses-the-bellows
    kind: report
    locator: "p. 100"
    quote:
      de: "der Balg 95 dagegen öffnet die Drossel 97, die bei korrekter Einstellung jene Menge Luft in den linken Teil der Windkammer 86 und die Kondukte 88 einfliessen lässt, die für den sofortigen Abbau des Unterdrucks auf das für den Piano-Anschlag notwendige Minimum zusätzlich benötigt wird"
    translation: >
      bellows 95 by contrast opens throttle 97, which when correctly set lets into the left
      part of wind chamber 86 and into conduits 88 that quantity of air additionally needed
      for the immediate reduction of the vacuum to the minimum required for the piano blow.
    subject: drossel-97
    property: acts-on
    object: delivered-vacuum
    scope: welte-t100
    holds: TRUE
    adopt: true
    comprehension: >
      Three words carry it. "Sofortig" is set against the timed reopening through throttle
      96; "zusätzlich" says this is an addition to that reopening and not the same path; and
      the destination named is the wind chamber and conduits 88, downstream of the cone
      valve. So during a subito piano the delivered vacuum is not a function of the
      Nuancierbalg position alone, and a trace of delivered vacuum would have to show a
      spike there that a trace of bellows position could not.

  - id: sforzando-off-auxiliaries-are-momentary
    kind: report
    locator: "p. 100"
    quote:
      de: "Wie beim Crescendo stellt sich auch dieser Teil der Vorrichtung wieder in die Ausgangsposition ein, wenn die Funktion erfüllt ist und die Perforation auf dem Notenband verschwindet."
    subject: function-sforzando-off
    property: latching-behaviour
    object: momentary
    scope: welte-t100
    holds: TRUE
    adopt: true
    note: >
      Said of the two auxiliary bellows 94 and 95, so the reopening assist through 96 is
      duration-proportional and cumulative. Note that Hagmann here makes exactly the
      distinction he is often said to blur: this part returns to rest when the perforation
      goes, and the sforzando valve, two sentences earlier, does not.

  - id: regelbalg-is-a-closed-loop
    kind: report
    locator: "p. 97"
    quote:
      de: "vom Regelbalg 91, dessen Aufgabe darin besteht, die Saugspannung auch dann konstant zu halten, wenn die Zahl der angeschlagenen Töne über ein gewisses Mass hinaus steigt … Der Regelbalg verhindert damit, dass die Kraft des Anschlags als Folge vollgriffigen Spiels abnimmt."
    subject: regelbalg-91
    property: acts-on
    object: delivered-vacuum
    scope: welte-t100
    holds: TRUE
    adopt: true
    note: >
      It senses the delivered vacuum in wind chamber 86 and opens the cone valve until
      spring 101 is back in balance. Two consequences the model needs: the loudness drop
      from dense playing is cancelled by design, and mezzoforte is therefore a fixed
      position of the Nuancierbalg rather than a fixed delivered vacuum.

  - id: cone-valve-is-a-sum
    kind: report
    locator: "p. 97"
    quote:
      de: "Die Stellung des Kegelventils 87 wird aber noch von einem zweiten Balg kontrolliert, an dessen beweglichem Teil das vom Kegelventil über die Rolle des Nuancierbalgs laufende Kettenband befestigt ist"
    translation: >
      The position of cone valve 87 is however also controlled by a second bellows, to whose
      moving part the chain band running from the cone valve over the roller of the
      Nuancierbalg is fastened.
    subject: kegelventil-87
    property: combining-law
    object: additive
    scope: welte-t100
    holds: TRUE
    adopt: true
    mentions: [nuancierbalg-90, regelbalg-91, kettenband]
    comprehension: >
      One inextensible band, fastened at one end to the Regelbalg and run over the
      Nuancierbalg's roller to the cone valve, can only put the valve where the two bellows
      together leave it: the position is a sum. Hagmann gives neither the linkage ratio nor
      whether the two segments are geometrically equivalent, so the exact combining law is
      not in the source, only that it combines.

