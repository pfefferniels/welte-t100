# Peter Hagmann's chapter "Die Nuancierungseinrichtung", the standing description of the
# mechanism. Every quotation below was read out of the local PDF on 2026-09-02 and is
# cited to the printed page, not to the PDF page.
#
# Two cautions govern the whole file. Hagmann worked from two instruments in Seewen and
# says himself that construction details varied over the production run, so his subject is
# a design as he found it realised twice. And his plates are captioned "Nach Welte 2", a
# T-98 Betriebsanleitung, which is why what is read off Anhang 13 lives in its own source
# file and not in this one.

source:
  id: hagmann-1984
  kind: dissertation
  title: "Das Welte-Mignon-Klavier, die Welte-Philharmonie-Orgel und die Anfänge der Reproduktion von Musik"
  authors: [hagmann-peter]
  container: "Europäische Hochschulschriften XXXVI/10, Bern: Lang"
  year: 1984
  pages: "95–107 (Die Nuancierungseinrichtung)"
  copy: "~/Zotero/storage/MKFDAXRE/Hagmann - 1984 - Das Welte-Mignon-Klavier, die Welte-Philharmonie-O.pdf"
  url: "https://freidok.uni-freiburg.de/dnb/download/608"
  note: >
    The chapter is the only connected technical description of the T-100 nuancing gear in
    print, and everything later written about it, Gottschewski included, defers to it. It
    gives no vacuum figure for the piano and no timing in seconds anywhere: every duration
    is defined relative to the roll, by marker tones on the Skalarolle.

statements:

  # -- how the bellows moves ---------------------------------------------------

  - id: nuancierbalg-opened-by-air-and-spring
    kind: report
    locator: "p. 96"
    quote:
      de: "der durch einströmende Luft und eine ihm eingebaute Feder geöffnet, durch die im Relais erzeugten Saugspannungen aber geschlossen wird"
    subject: nuancierbalg-90
    property: opening-and-closing-agency
    object: air-and-spring-open-suction-closes
    scope: welte-t100
    holds: TRUE
    adopt: true
    note: >
      The asymmetry matters for the model: closing is driven by the supply vacuum and so
      scales with it, while reopening runs off atmosphere and the bellows' own spring and
      does not.

  # One sentence of Hagmann's does four jobs: it names three stops and says that everything
  # between them is uncontrolled. Four propositions, one quotation.

  - id: fixed-position-fully-open
    kind: report
    locator: "pp. 96–97"
    quote:
      de: "Drei feste Positionen des Nuancierbalgs 90 sind vorgesehen."
    subject: nuancierbalg-90
    property: fixed-position
    object: position-fully-open
    scope: welte-t100
    holds: TRUE
    adopt: true
    note: >
      The Piano end of the range: what the fully open bellows delivers is set at the leather
      nut 92.

  - id: fixed-position-fully-closed
    kind: report
    locator: "pp. 96–97"
    quote:
      de: "Drei feste Positionen des Nuancierbalgs 90 sind vorgesehen."
    subject: nuancierbalg-90
    property: fixed-position
    object: position-fully-closed
    scope: welte-t100
    holds: TRUE
    adopt: true
    note: >
      The Forte end. Whether a slow crescendo alone ever reaches it is a separate question,
      answered short of it by the Leseregeln chapter, by Phillips and by the fit.

  - id: fixed-position-mezzoforte
    kind: report
    locator: "pp. 96–98"
    quote:
      de: "Die Mittelstellung des Mezzoforte wird erreicht, wenn der Dorn des betätigten und deshalb geschlossenen Mezzofortebalgs 93 Oeffnung oder Schliessung des Nuancierbalgs auf halbem Wege unterbricht."
    subject: nuancierbalg-90
    property: fixed-position
    object: position-mezzoforte-middle
    scope: welte-t100
    holds: TRUE
    adopt: true
    mentions: [mezzofortebalg-93]

  - id: between-stops-uncontrolled
    kind: report
    locator: "pp. 96–97"
    quote:
      de: "Zwischen diesen drei festen Positionen ist der Nuancierbalg frei beweglich: Die Vorrichtung ermöglicht also eine stufenlose Regulierung der Dynamik zwischen Piano, Mezzoforte und Forte, wobei sich freilich der Nuancierbalg ausserhalb der drei festen Positionen in steter Bewegung befindet, sich in den Bereichen zwischen Forte und Mezzoforte beziehungsweise Mezzoforte und Piano also nicht exakt kontrollieren lässt."
    translation: >
      Between these three fixed positions the Nuancierbalg is freely movable: the device
      thus allows a stepless regulation of the dynamic between piano, mezzoforte and forte,
      though outside the three fixed positions the Nuancierbalg is in constant motion and so
      cannot be exactly controlled in the ranges between forte and mezzoforte, or mezzoforte
      and piano.
    subject: nuancierbalg-90
    property: control-principle
    object: rates-not-levels
    scope: welte-t100
    holds: PROBABLE
    adopt: false
    comprehension: >
      Hagmann does not say "rates". He says the bellows is in constant motion between the
      stops and that its position there cannot be exactly controlled, which is what a device
      that selects rates rather than levels looks like from the outside. Held PROBABLE for
      that reason, and not adopted from him: the principle is adopted from Gottschewski, who
      states it outright twelve years later, and from the roll.

  - id: mezzoforte-louder-than-piano
    kind: report
    locator: "pp. 96–97"
    quote:
      de: "eine stufenlose Regulierung der Dynamik zwischen Piano, Mezzoforte und Forte"
    subject: state-mezzoforte
    property: louder-than
    object: state-piano
    scope: welte-t100
    holds: TRUE
    adopt: true
    note: >
      The order of the three stops, as CRMsci's ordering of types. Nothing here says by how
      much, which is the point of recording an order rather than a value.

  - id: forte-louder-than-mezzoforte
    kind: report
    locator: "pp. 96–97"
    quote:
      de: "eine stufenlose Regulierung der Dynamik zwischen Piano, Mezzoforte und Forte"
    subject: state-forte
    property: louder-than
    object: state-mezzoforte
    scope: welte-t100
    holds: TRUE
    adopt: true

  - id: mezzoforte-pin-halfway
    kind: report
    locator: "pp. 97–98"
    quote:
      de: "Die Mittelstellung des Mezzoforte wird erreicht, wenn der Dorn des betätigten und deshalb geschlossenen Mezzofortebalgs 93 Oeffnung oder Schliessung des Nuancierbalgs auf halbem Wege unterbricht."
    translation: >
      The mezzoforte middle position is reached when the pin of the actuated, and therefore
      closed, Mezzoforte bellows 93 interrupts the opening or the closing of the
      Nuancierbalg half way.
    subject: mezzofortebalg-93
    property: blocks-in-directions
    object: both-directions
    scope: welte-t100
    holds: TRUE
    adopt: true
    comprehension: >
      "Oeffnung oder Schliessung … unterbricht" — opening or closing, so the pin interrupts
      travel in either direction. Independent of Welte's own sentence in Hagemann 2001,
      which says the same thing in different words, and reached by a different route: Welte
      is talking about what can sound, Hagmann about what the pin does to the bellows.
    note: >
      "Auf halbem Wege" is the only positional statement about the hook in the literature.
      It is not a measurement, and the roll disagrees with it: the drawn line is arrested at
      0.627 and 0.645 of the P-to-F travel, not at half.

  - id: mezzoforte-position-on-scale
    kind: report
    locator: "pp. 97–98"
    quote:
      de: "auf halbem Wege"
    subject: mezzofortebalg-93
    property: mf-position-on-scale
    value: 0.5
    unit: travel-fraction
    scope: welte-t100
    holds: TRUE
    adopt: false
    note: >
      Recorded as a number so that it lands in the contested register beside midi2exp's
      0.4545 and the roll's measured 0.627 / 0.645. Not adopted: "auf halbem Wege" is a
      description of an arrangement, and reading it as a figure accurate to two decimals
      would be putting weight on it that Hagmann does not.

  # -- the tracker-bar layout --------------------------------------------------

  # The order of the openings across the glide block, as five adjacent pairs. The three
  # pairs that put a cancelling opening outboard of its setting opening are Hagmann's
  # design statement, with his note 27 giving the reason: a slight lateral drift of the
  # paper then cancels a function rather than triggering one. The two pairs between
  # functions come from his listing of the sequence. The numbers 7 to 12 are labels on the
  # drawing, not roll line numbers; Anhang 10 gives the roll lines as 100 down to 95, which
  # is the easiest confusion to make in this chapter.

