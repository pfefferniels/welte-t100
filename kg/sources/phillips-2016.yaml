    adopt: false
    note: >
      The only account in the literature of what physically drew the lines, and it is about
      playback of a production roll, not about the recording session. "Appear to have been"
      is why it is PROBABLE.

  - id: lines-drawn-by-styli-at-the-regulators
    kind: report
    locator: "p. 120, with p. 222"
    quote:
      en: "A clue is the expression lines found on some Welte-Mignon rolls produced after 1922, as shown in Figure 2.2. These lines appear to have been drawn by styli attached to pneumatics that were connected to the bass and treble expression regulators of a Welte-Mignon that was playing the roll."
    subject: drawn-expression-lines
    property: records
    object: nuancierbalg-position
    scope: welte-t100
    holds: PROBABLE
    adopt: false
    comprehension: >
      He writes "connected to the bass and treble expression regulators" and at p. 222
      "connected to the bass and treble suction regulators", so what the stylus followed is
      the regulator assembly. Reading that as the position of the Nuancierbalg rather than as
      the delivered vacuum is the project's step, and it is a step Phillips himself could not
      take: his first assumption makes position and suction interchangeable, so his evidence,
      the agreement in shape between his oscilloscope trace and the roll's line, cannot
      distinguish them. The reading is entered here because it is the only one on which his
      sentence names an apparatus at all.
    note: >
      An independent answer to the question the whole project turns on, and the only positive
      one in the literature. Hagmann and Gottschewski both say the recording procedure is
      undocumented, and both are right, but Phillips is not talking about the recording
      procedure: his claim is that the lines on the late production rolls were drawn at
      playback, by a Welte-Mignon playing the roll. That is a different event, and it is one
      that could leave the traces this project measures. His ground is stated at p. 222: the
      shape of his model's trace and the shape of the line on the roll agree. Held PROBABLE
      because he says "appear to have been", and not adopted, because the project holds the
      same conclusion on stronger evidence in
      `roll-3309-observations/line-records-bellows-not-vacuum`.

  - id: phillips-answers-for-roll-3309
    kind: inference
    locator: "p. 120 and p. 222, applied to roll 3309"
    holder: pfeffer-niels
    subject: drawn-line-3309
    property: records
    object: nuancierbalg-position
    premises:
      - lines-drawn-by-styli-at-the-regulators
      - lines-appear-on-rolls-after-1922
      - pfeffer-leseregeln/punching-date
    logic: subsumption-under-a-described-class
    holds: PROBABLE
    adopt: false
    note: >
      Carried down from the class to the instance so that the register for what roll 3309's
      lines record holds Phillips's answer beside the project's. Roll 3309 was punched in
      November 1922 and so falls inside the window he gives, and its two lines are laid out
      as he describes, mirrored about a shared central maximum. Entered as an inference and
      not as his statement, because he never saw this roll. It does not contradict
      `gottschewski-1996/no-piano-recording-rolls-survive` or
      `hagmann-1984/recording-procedure-undocumented`, and the distinction is the point:
      those two are about the recording rolls and the recording session, Phillips is about
      a stylus running on a production roll at playback, years later. Both absences stand and
      the literature turns out to say something about the lines all the same. Held PROBABLE,
      and not adopted, because the project holds the same conclusion from the roll itself on
      stronger and independent evidence.

  - id: lines-appear-on-rolls-after-1922
    kind: observation
    locator: "p. 120"
    quote:
      en: "the expression lines found on some Welte-Mignon rolls produced after 1922"
    subject: drawn-expression-lines
    property: date-of
    date: { begin: "1922-01-01", label: "on Welte-Mignon rolls produced after 1922" }
    holds: TRUE
    adopt: true
    mentions: [roll-3309]
    note: >
      Roll 3309 was punched on 22 November 1922, at the very start of the window Phillips
      gives. The date is worth having because it is the only external check on the class the
      roll belongs to, and because it makes the lines a late feature of the production
      process rather than a survival from the recording session.

  - id: lines-were-for-the-playerist
    kind: report
    locator: "p. 120"
    quote:
      en: "The purpose of the lines was so a playerist could follow the original dynamics when pedalling the roll."
    subject: drawn-expression-lines
    property: intended-for
    object: hand-nuancing-by-a-playerist
    holds: PROBABLE
    adopt: false
    note: >
      Printed so that someone pedalling the roll on an ordinary player piano, rather than
      playing it on a reproducing piano, could follow the dynamics of the original
      performance by hand. He gives no evidence for the purpose and none is obvious, which
      is why it is held PROBABLE. It is the reading the German name carries too:
      Handnuancierung is nuancing by hand. If it is right, the lines were drawn to be
      followed rather than to be accurate, and that is a caveat worth keeping beside every
      figure this project measures off them.

  - id: centre-line-is-the-shared-maximum
    kind: observation
    locator: "p. 222"
    quote:
      en: "The centre line on the roll in Figure 4.7 (a) indicates the maximum level of both dynamic lines, therefore the treble (higher) dynamic line on the roll is upside down compared to the oscilloscope display."
    subject: gridline-central-ff
    property: marks-scale-end-of
    object: state-fortissimo
    holds: TRUE
    adopt: true
    mentions: [drawn-expression-lines]
    note: >
      The two drawn lines are laid out mirrored about a shared central gridline that marks
      the maximum of both, so the treble line runs upside down with respect to the bass one.
      Independent confirmation of the layout the project's scale unit is defined against:
      0.0 at each half's own P.P. gridline, 1.0 at the shared central F.F. gridline.
      Phillips reads it off a different roll and states it as a consequence of comparing his
      trace with the paper.

  - id: outer-line-is-the-minimum
    kind: observation
    locator: "p. 120, Figure 2.2"
    subject: gridline-pp
    property: marks-scale-end-of
    object: state-piano
    holds: TRUE
    adopt: true
    mentions: [drawn-expression-lines]
    note: >
      His Figure 2.2 labels the arrangement, PP outermost and FF at the centre for both
      halves.

  - id: feedback-check-at-the-recording-piano
    kind: report
    locator: "p. 120"
    quote:
      en: "If such a trace was a normal outcome of a recording session, it would have been possible to check the expression coding added to a roll by playing it on the recording piano and comparing the dynamic lines produced by the original playing and the roll recording, explaining the confidence Welte and Bockisch had in their product."
    subject: styli-on-pneumatics-at-the-regulators
    property: intended-for
    object: checking-expression-coding-against-the-performance
    holds: PROBABLE
    adopt: false
    note: >
      A conjecture, stated as one, and it does not bear on what the lines on a production
      roll record. Entered because it is the only account in the graph of why anyone would
      have built the apparatus, and because if it is right the same kind of line existed at
      both ends of the process, which would make the class this project measures harder to
      date than the 1922 window suggests.

  # -- suction and MIDI velocity, the far end of the chain ---------------------

  - id: velocity-is-logarithmic-in-suction
    kind: measurement
    locator: "p. 216"
    quote:
      en: "The graphs show that the relationship between suction and MIDI velocity is essentially logarithmic, in which a small change in suction at the low end of the graphs gives a much greater change in MIDI velocity level compared to a similar suction change at the high end."
    subject: tonpneumatik
    property: velocity-suction-relation
    object: logarithmic-in-vacuum
    scope: pneumatic-pianos-generally
    holds: TRUE
    adopt: false
    note: >
      Ten graphs from a bench rig in which a pneumatic worked a wooden finger on a Disklavier
      key, five strikes at each of twenty-five suction levels from 5 to 29 inches WG, each
      test repeated at least twice, read against a single-tube manometer. It is the only
      measurement in this graph of the step from delivered vacuum to playing dynamic. It
      bears directly on `velocity-span-fraction`, the unit the graph keeps apart from
      `travel-fraction` precisely because midi2exp's constants assume velocity is linear in
      travel: Phillips measured that relation and it is not linear. Not adopted, because the
      rig is not a Welte and the curve is the Disklavier's as much as the pneumatic's, which
      he says himself.

  # The two endpoints that fix the curve above, each a velocity at a stated suction, so the
  # suction is in the property type and the velocity is the value. Measured on the bench
  # rig, which is the subject; the stack in general is what they are taken to say something
  # about, and that is the scope.

  - id: velocity-endpoints-for-middle-c
    kind: measurement
    locator: "pp. 216–217"
    quote:
      en: "At this value of suction, middle C played at MIDI level 30, which is about as soft as can be reliably achieved by many solenoid mechanical pianos."
    subject: phillips-bench-rig
    property: velocity-at-minimum-suction
    value: 30
    unit: midi-velocity
    scope: pneumatic-pianos-generally
    holds: TRUE
    adopt: false
  - id: velocity-of-middle-c-at-the-top
    kind: measurement
    locator: "pp. 216–217"
    quote:
      en: "while at this level, middle C registered MIDI 88"
    subject: phillips-bench-rig
    property: velocity-at-maximum-suction
    value: 88
    unit: midi-velocity
    scope: pneumatic-pianos-generally
    holds: TRUE
    adopt: false
    note: >
      A nearly sixfold change of suction bought fifty-eight velocity steps.
  - id: velocity-of-the-lightest-notes-at-the-top
    kind: measurement
    locator: "pp. 216–217"
    quote:
      en: "The maximum playing levels of the lightest notes were found to exceed MIDI 100 at 29 inches WG"
    subject: phillips-bench-rig
    property: velocity-of-lightest-notes-at-maximum-suction
    lower: 100
    unit: midi-velocity
    scope: pneumatic-pianos-generally
    holds: TRUE
    adopt: false

  # Hammer weight, at one and the same suction: three differences and what they do to the
  # loudness. Tests on five notes across two Disklaviers with differently weighted actions,
  # the weights judged by eye. They say what the split stack at F♯/G costs: on either side
  # of that break equal suction gives unequal loudness, so the two halves have to be
  # regulated apart for a reason that has nothing to do with the music.

  - id: velocity-depends-on-hammer-weight
    kind: measurement
    locator: "p. 215"
    quote:
      en: "The average difference in MIDI velocities between C8 and the heaviest note (C2) is a substantial seventeen steps, with around twelve steps between C8 and C5. C2 is around three steps lower in velocity than C5. This shows the effect of hammer weight on the closing speed of a note-playing pneumatic."
    subject: tonpneumatik
    property: velocity-spread-top-to-bottom
    value: 17
    unit: midi-velocity
    scope: pneumatic-pianos-generally
    holds: TRUE
    adopt: false
    mentions: [phillips-bench-rig]
    note: >
      The premise under `hammer-weight-explains-the-halves`. He notes the relation appears
      linear in hammer weight.
  - id: velocity-spread-to-middle-c
    kind: measurement
    locator: "p. 215"
    quote:
      en: "with around twelve steps between C8 and C5"
    subject: tonpneumatik
    property: velocity-spread-top-to-middle-c
    value: 12
    unit: midi-velocity
    scope: pneumatic-pianos-generally
    holds: TRUE
    adopt: false
    mentions: [phillips-bench-rig]
  - id: velocity-spread-below-middle-c
    kind: measurement
    locator: "p. 215"
    quote:
      en: "C2 is around three steps lower in velocity than C5."
    subject: tonpneumatik
    property: velocity-spread-middle-c-to-bottom
    value: 3
    unit: midi-velocity
    scope: pneumatic-pianos-generally
    holds: TRUE
    adopt: false
    mentions: [phillips-bench-rig]
  - id: loudness-is-roughly-even
    kind: report
    locator: "p. 215"
    subject: tonpneumatik
    property: loudness-across-keyboard-at-equal-suction
    object: roughly-equal-across-keyboard
    scope: pneumatic-pianos-generally
    holds: TRUE
    adopt: false
    note: >
      Because a lighter hammer at a higher velocity delivers about the same loudness, the
      perceived volume is roughly unchanged across the keyboard at one suction.

  - id: minimum-usable-stack-vacuum
    kind: measurement
    locator: "p. 216"
    quote:
      en: "For example, the lightly weighted treble notes could be played at a suction level of four inches WG, but working progressively down the keyboard showed that notes responded spasmodically or not at all. Rather, suction levels of five inches WG and higher were necessary for consistent behaviour."
    subject: tonpneumatik
    property: minimum-reliable-vacuum
    value: -127.0
    unit: mm-water-column
    scope: pneumatic-pianos-generally
    holds: TRUE
    adopt: false
    note: >
      Worth putting beside Hagemann's ladder, where Piano is −101.6 mm WS, that is four
      inches: the state Welte calls Piano is where Phillips finds the bass notes beginning to
      fail. Two different machines and a bench rig, so this is not a contradiction, but it
      says how little margin the soft end of the T-100 scale has and it fits Brougher's
      practice of setting the first intensity at five inches. The conversion from inches is
      the project's; his figure is verbatim in the quotation.

  - id: typical-zero-level
    kind: report
    locator: "p. 213"
    quote:
      en: "A typical 'zero' level is between four and six inches WG, while a maximum level might be fourteen inches WG, or more typically 25 to 30 inches WG."
    subject: tonpneumatik
    property: vacuum-in-piano
    lower: -152.4
    upper: -101.6
    unit: mm-water-column
    scope: pneumatic-pianos-generally
    holds: TRUE
    adopt: false
    note: >
      A range of what is usual rather than a measurement of one machine, and he says in the
      same paragraph that it depends on owner preference and on the regulation of the action.
      Hagemann's measured Piano at −101.6 mm WS is the top of Phillips's range exactly, and
      Brougher sets his first intensity at five inches, the middle of it. Three witnesses,
      three methods, one figure, which is unusual in this graph.

  - id: typical-maximum-level
    kind: report
    locator: "p. 213"
    quote:
      en: "while a maximum level might be fourteen inches WG, or more typically 25 to 30 inches WG. A range of five to 29 inches WG was chosen as a basis with which to begin."
    subject: tonpneumatik
    property: vacuum-at-full-closure
    lower: -762.0
    upper: -635.0
    unit: mm-water-column
    scope: pneumatic-pianos-generally
    holds: TRUE
    adopt: false
    note: >
      The loud end is where the witnesses part. Brougher wants about 35 inches for a grand
      and 32 for an upright, Phillips calls 25 to 30 typical and 14 possible, and Hagemann
      measures Fortissimo at −355.6 mm WS, which is 14 inches, on an instrument whose blower
      runs at 16 to 18. So Hagemann's whole ladder sits at Phillips's lower alternative and
      at less than half of Brougher's figure. The graph records the spread and does not
      resolve it; part of it is certainly that Hagemann reads between Betonungs- and
      Tonpneumatik while the other two read at the stack or at the pump.
