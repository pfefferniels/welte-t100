  # -- what the models assume, and where the roll answers back -----------------

  - id: vacuum-is-a-function-of-position
    kind: report
    locator: "p. 225"
    quote:
      en: "The first assumption is that the suction level is exactly related to the position of the expression pneumatic. The assumption is supported by measurements taken from original instruments, although such readings are not exact and some non-linearity may apply, particularly at the extremes of travel of the pneumatic. For example, slight movement from the fully open (zero) position may create a greater change in suction than the same movement a few millimetres of travel later."
    subject: nuancierbalg-90
    property: position-to-vacuum-relation
    object: exact-function-of-position
    scope: welte-t100
    holds: PROBABLE
    adopt: false
    note: >
      He states it as an assumption and names its likely failure, which is the honest form of
      the premise every emulation here rests on. His expected non-linearity is largest at the
      two extremes and in a definite direction: steep just off the zero position, shallow
      over the last few millimetres before closure. Hagemann's dome travel gives one point of
      the same relation, 11 mm on the discant and 8 mm on the bass for −100 to −200 mm WS,
      and no source in this graph gives a second, which is why the conversion between bellows
      travel and delivered vacuum is still the one the project most wants and cannot have.

  - id: no-figures-for-the-position-vacuum-measurements
    kind: assessment
    locator: "p. 225, and Chapter 4 read through"
    holder: pfeffer-niels
    about: phillips-2016-thesis
    gloss: >
      The measurements from original instruments that Phillips says support the first
      assumption are not printed anywhere in the thesis, and no instrument is named for them.
      So the claim that delivered vacuum is an exact function of bellows position rests, in
      this source, on an appeal to readings the reader cannot see.
    holds: UNKNOWN
    note: >
      A clean negative from Chapter 4 read through and from searching the thesis for the
      terms. Recorded because it is the one place where this source could have closed the gap
      Hagemann leaves open, and because the reader would otherwise take the appeal for a
      citation.

  - id: constant-speed-assumption
    kind: report
    locator: "p. 225"
    quote:
      en: "The second assumption is that the expression pneumatic moves at a constant speed over its full stroke for both slow and fast actions. In theory, a pneumatic that is being exhausted through a fixed aperture by a fixed level of suction will close at a constant rate, because the air inside the pneumatic is being withdrawn at a constant rate. However, this assumes the external forces working against the pneumatic remain constant."
    subject: nuancierbalg-90
    property: speed-over-the-stroke
    object: constant-speed
    scope: welte-t100
    holds: PROBABLE
    adopt: false
    note: >
      The same law midi2exp implements, and here it is argued for rather than merely coded.
      The argument is that a fixed aperture under a fixed vacuum removes air at a constant
      rate. It holds only while the pressure across the aperture is fixed, which it is not
      once the bellows has begun to draw down, and Phillips guards it with a caveat about
      external forces rather than about the pressure difference. He states it as an
      assumption and lists it among the things that could make his models behave differently
      from a Welte.

  - id: drawn-lines-are-rounded-at-the-bottom
    kind: observation
    locator: "pp. 225–226"
    quote:
      en: "The dynamic lines on the roll are rounded at the bottom of each excursion, while those generated by the models are not rounded. […] The difference is that the softest playing level (zero level) is reached slightly later by the pneumatic regulator compared to how the models behave."
    subject: drawn-expression-lines
    property: trace-shape-at-the-soft-end
    object: rounded-at-the-bottom
    holds: TRUE
    adopt: true
    note: >
      Phillips saw the curvature this project measures and read it the other way. He puts it
      down to a non-linearity in the relation between bellows position and suction, near the
      zero end where his first assumption predicts one, and prices it at one or two MIDI
      velocity steps, which is below what he can hear. Recorded as an observation because the
      shape of the line is what he saw, and the explanation is a separate claim.

  - id: model-traces-are-not-rounded
    kind: observation
    locator: "pp. 225–226"
    quote:
      en: "while those generated by the models are not rounded"
    subject: phillips-welte-decoder
    property: trace-shape-at-the-soft-end
    object: not-rounded
    holds: TRUE
    adopt: true
    note: >
      The constant-speed model reaches the zero level in a straight ramp, and that is the
      one place he saw it differ from the paper.

  - id: the-roll-rejects-the-constant-speed
    kind: inference
    locator: "emulator/docs/empirics.md §3, against p. 225"
    holder: pfeffer-niels
    subject: nuancierbalg-90
    property: speed-over-the-stroke
    object: approaches-a-target
    premises:
      - constant-speed-assumption
      - drawn-lines-are-rounded-at-the-bottom
      - roll-3309-observations/constant-rate-is-rejected
      - roll-3309-observations/decrescendo-tau-bass
      - roll-3309-observations/decrescendo-tau-treble
    logic: exponential-versus-constant-fit
    scope: welte-t100
    contradicts: [constant-speed-assumption]
    holds: TRUE
    adopt: true
    note: >
      The drawn line on roll 3309 rejects a constant rate against an exponential approach by
      a factor of four to eleven in weighted rms, in all four state-by-half combinations, and
      the default decrescendo's time constant comes out at 592 ms in the bass and 661 ms in
      the treble, which is a rate that halves about every four tenths of a second and not a
      constant one. Phillips's rounded
      bottoms are the same curvature seen on a different roll, and his two candidate
      explanations, a non-linear position-to-vacuum map and a non-constant speed, are exactly
      the two the project can separate and he could not: the null result at the Mezzoforte
      stop shows the line is tracking bellows position and not delivered vacuum, so the
      curvature cannot be in the map and has to be in the motion. That is the one place in
      this graph where a measurement on the paper settles a question a builder had to leave
      open, and it is worth saying that he had already found the evidence.

  - id: non-linearity-costs-two-velocity-steps
    kind: report
    locator: "p. 226"
    quote:
      en: "Determining the MIDI velocity levels that would occur if the expression pneumatic behaved according to the dynamic lines in Figure 4.7(a) showed an indiscernible difference of one or two steps. […] Comparing the playing dynamics produced by both look-up tables to determine if a non-linearity exists has proven inconclusive."
    subject: phillips-welte-decoder
    property: velocity-cost-of-curvature
    lower: 1
    upper: 2
    unit: midi-velocity
    holds: TRUE
    adopt: true
    note: >
      His reason for setting the curvature aside, and it is a good one for his purpose and
      not for this project's. A decoder is judged by whether it convinces a listener; a model
      of the mechanism is judged against the line the mechanism drew, where one or two
      velocity steps is well above the 0.0008 scale units the null result resolves. The same
      evidence carries different weight in the two enterprises, which is worth having on
      record before the disagreement above is read as a correction.

