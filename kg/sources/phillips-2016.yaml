  - id: paper-speed-t100
    kind: measurement
    locator: "p. 113"
    quote:
      en: "Welte-Mignon rolls generally run at the same paper speed (roll tempo) of three metres or 9.84 feet per minute. Paper speed is set correctly by using the tempo test on a Welte-Mignon test roll, from which I have determined that the roll drive motor should rotate at 120 RPM."
    subject: welte-t100
    property: paper-speed
    value: 3.0
    unit: metre-per-minute
    holds: TRUE
    adopt: false
    mentions: [phillips-welte-mignon-test-roll]
    note: >
      The figure the dissertation's Fn. 182 attributes to him, and it agrees with
      Gottschewski's reading of the surviving Skalarollen at 143.1 to 150 cm per thirty
      seconds. SUPRA uses 9.64 ft/min instead, which is 2.94 m/min. What Phillips adds is an
      operational check rather than a new number: the tempo test on the test roll fixes the
      drive motor at 120 RPM, so the speed can be set on an instrument without measuring
      paper. Note that his own "9.84 feet per minute" is 3.0 m/min to three figures, so the
      two units in his sentence are the same claim and not two.

  - id: acceleration-was-compensated-at-recording
    kind: report
    locator: "p. 113, with p. 180"
    quote:
      en: "Because the paper transport geometry in the Welte-Mignon is similar to that in the recorder, the accelerating paper speed does not cause an increase in the tempo of the music."
    subject: welte-t100
    property: acceleration-compensation
    object: cancelled-by-a-matching-recorder-spool
    scope: welte-t100
    holds: PROBABLE
    adopt: false
    mentions: [welte-recording-process, parameter-accel-ft-per-min2]
    note: >
      The recording machine's take-up spool was about the same diameter as the
      Welte-Mignon's, so the paper accelerated in the same way at recording as at playback
      and the acceleration cancels. A roll played at a constant paper speed, as a scan is,
      will therefore run slow rather than being neutral.
      His ground is a photograph of the organ-roll recording machine on the Pianola Institute
      site, from which he judges the spool diameters similar, so this is an argument from a
      picture and is held as one. It matters here because every duration measured off the
      drawn line depends on the acceleration model applied to the scan, and the graph already
      records that midi2exp's acceleration constant has no stated provenance.

  - id: punch-hole-and-step
    kind: measurement
    locator: "p. 114"
    quote:
      en: "In both cases a single punch hole measured 2.19 mm. Measurements of extended perforations involving a number of closely spaced punches showed the smallest distance between punches was 0.47 mm, which in Imperial terms equates to 0.0185 inches or 54 steps per inch."
    subject: welte-t100
    property: perforation-diameter
    value: 2.19
    unit: millimetre
    holds: TRUE
    adopt: false
    contradicts: [pfeffer-leseregeln/red-perforations-after-1910]
    note: >
      Measured on two rolls, one on lined and one on blank red paper, both dated 1912 on the
      roll. This is against the figure the dissertation carries at Fn. 66 from Hagmann p. 76,
      that perforations on red rolls were 2.2 mm until about 1910 and 1.8 mm afterwards:
      Phillips measures the earlier diameter on rolls punched two years after the change. One
      of the two is wrong about the date or about the roll, and the question matters for
      roll 3309, punched in 1922 and so taken to be a 1.8 mm roll on Hagmann's account.

