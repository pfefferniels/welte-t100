  # -- what a perforation does to a valve, and for how long --------------------

  # Four causes of a valve's on-time, measured on his own valve models for the roll reader.
  # They are the four constants the emulator carries for the same part, `trip-threshold`,
  # `charge-time`, `bleed-time` and `moving-mass-time`, arrived at by fitting a drawn line
  # rather than by bench tests. That the two lists coincide is the strongest external
  # support in this graph for modelling the valve at all rather than treating a perforation
  # as its own signal.

