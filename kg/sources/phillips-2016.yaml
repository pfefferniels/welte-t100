# Peter Phillips's thesis: the one prior attempt to model the T-100 expression regulator.
#
# Phillips built an analogue electronic circuit whose output voltage stands for the position
# of the expression pneumatic, adjusted it against the Welte-Mignon test roll by the roll's
# own criteria, and read the travel times off an oscilloscope. That is the same object this
# project fits to a drawn line, reached from the other end and thirty years after Hagmann.
# Nothing else in this graph gives a number for the fast travel times, and nothing else in it
# reports the apparatus that drew the lines on roll 3309.
#
# Scope. Only the dynamics regulation of the T-100 dynamics pneumatics is taken in, together
# with the two things every timing here depends on: how long a perforation holds a valve, and
# how fast the paper runs. The catalogue chapters, the roll reader's construction, the Ampico
# and Duo-Art expression systems and the MIDI editing chapter are all left out. The Green
# Welte timings of Table 4.2 are left out as out of scope; the Licensee pair of Table 4.3 is
# kept, because it is what separates the two answers already in the register to Welte's
# Kontrolle 3.
#
# Quotations were checked against the text layer of the local PDF on 2026-09-02. Printed page
# numbers are used throughout; they run nine behind the PDF's.

source:
  id: phillips-2016
  kind: dissertation
  title: "Piano Rolls and Contemporary Player Pianos: The Catalogues, Technologies, Archiving and Accessibility"
  authors: [phillips-peter]
  container: "PhD thesis, Sydney Conservatorium of Music, University of Sydney"
  year: 2016
  pages: "110–127, 175–181, 209–230"
  copy: "~/Zotero/storage/PNRJITZ5/Phillips - Piano Rolls and Contemporary Player Pianos.pdf"
  note: >
    Submitted 2016, signed 2 July 2017. Phillips writes as a builder rather than a
    historian: the thesis reports a roll reader, a pneumatic switch design, an analogue
    model of the Welte expression regulator and a microprocessor decoder built from it. He
    had unfettered access to the Denis Condon collection before Stanford bought it, which is
    the collection roll 3309 comes from, so this source and the roll this project works on
    stand behind the same door. His account of the mechanism is taken from factory handbooks
    and from working on instruments owned by others; he names no Welte drawing and does not
    cite Hagmann, so where the two agree they agree independently.

statements:

  # -- the mechanism as he describes it ----------------------------------------

  - id: loudness-follows-stack-vacuum
    kind: report
    locator: "p. 210"
    quote:
      en: "The principle behind all reproducing pianos is that the loudness of a note depends on the level of suction applied to the pneumatic operating that note. This principle was patented by Welte, regardless of how the suction level might be regulated."
    subject: tonpneumatik
    property: control-principle
    object: delivered-vacuum
    holds: TRUE
    adopt: true
    note: >
      The premise under everything else, and the reason the graph can treat a bellows
      position and a playing dynamic as two ends of one chain. Phillips attributes the
      patent to Welte without giving its number.

  - id: position-determines-the-vacuum
    kind: report
    locator: "p. 210"
    quote:
      en: "In principle, the position of expression pneumatic N determines the level of suction supplied by the regulator to the player action. This important concept forms the basis of how the expression regulator is controlled by piano roll perforations."
    subject: nuancierbalg-90
    property: acts-on
    object: delivered-vacuum
    scope: welte-t100
    holds: TRUE
    adopt: true
    mentions: [kegelventil-87, regelbalg-91]
    comprehension: >
      Phillips's "expression pneumatic N" is Hagmann's Nuancierbalg 90, his "regulating
      valve K" the cone valve 87 and his "regulating bellows R" the Regelbalg 91. The
      identification is the project's: he works from a Welte handbook figure that carries
      letters, Hagmann from a drawing that carries numbers, and neither names the other's
      labels. Everything below that gives Hagmann's number for one of his parts rests on
      this reading.
    note: >
      He describes the same closed loop Hagmann does, in the same direction: pneumatic N
      pulls the cord, the valve opens a little, the regulating bellows moves much further and
      pays the cord back out. That is the mechanism behind `hagmann-1984/cone-valve-is-a-sum`
      arrived at without the drawing.

  - id: four-adjustments-two-speeds-each-way
    kind: report
    locator: "pp. 210–211"
    quote:
      en: "1. Slow closing speed, adjustment noted in Figure 4.1 as Crescendo F […] 2. Slow opening speed, adjustment Crescendo P […] 3. Fast closing speed, adjustment Forz F […] 4. Fast opening speed, adjustment Forz P"
    subject: nuancierbalg-90
    property: control-principle
    object: rates-not-levels
    scope: welte-t100
    holds: TRUE
    adopt: true
    note: >
      A fourth independent witness for the principle the whole model rests on, after
      Gottschewski 1996, Brougher and the roll. He states it in its strongest form on p. 212:
      "The system is based solely on the crescendo principle." His four adjusters are
      entities, and which of Hagmann's numbered parts each is are the inferences below.

  # Phillips's four adjusters, one per function, and their identification with Hagmann's
  # numbered parts. Three rest on Welte's own Kontrolle 3 and on Hagmann's note 32; the
  # fourth is the project's guess and is held as one.

  - id: crescendo-f-sets-the-slow-closing
    kind: report
    locator: "pp. 210–211, Figure 4.1"
    subject: function-crescendo-on
    property: adjusted-at
    object: phillips-adjuster-crescendo-f
    scope: welte-t100
    holds: TRUE
    adopt: false
  - id: crescendo-p-sets-the-slow-opening
    kind: report
    locator: "pp. 210–211, Figure 4.1"
    subject: function-crescendo-off
    property: adjusted-at
    object: phillips-adjuster-crescendo-p
    scope: welte-t100
    holds: TRUE
    adopt: false
  - id: forz-f-sets-the-fast-closing
    kind: report
    locator: "pp. 210–211, Figure 4.1"
    subject: function-sforzando-on
    property: adjusted-at
    object: phillips-adjuster-forz-f
    scope: welte-t100
    holds: TRUE
    adopt: false
  - id: forz-p-sets-the-fast-opening
    kind: report
    locator: "pp. 210–211, Figure 4.1"
    subject: function-sforzando-off
    property: adjusted-at
    object: phillips-adjuster-forz-p
    scope: welte-t100
    holds: TRUE
    adopt: false

  - id: crescendo-f-is-throttle-98
    kind: inference
    locator: "pp. 210–211, against welte-anhang-12 Kontrolle 3"
    holder: pfeffer-niels
    subject: phillips-adjuster-crescendo-f
    property: identified-with
    object: drossel-98
    premises: [crescendo-f-sets-the-slow-closing, welte-anhang-12/control-3-adjusts-98-for-the-crescendo]
    logic: composition-of-stated-mechanisms
    scope: welte-t100
    holds: PROBABLE
    note: >
      Both are the one adjuster of the slow closing speed; Welte numbers it and Phillips
      letters it. Probable rather than true because the two describe the part from opposite
      ends and neither names the other's label.
  - id: crescendo-p-is-bore-100
    kind: inference
    locator: "pp. 210–211, against welte-anhang-12 Kontrolle 3"
    holder: pfeffer-niels
    subject: phillips-adjuster-crescendo-p
    property: identified-with
    object: bohrung-100
    premises: [crescendo-p-sets-the-slow-opening, welte-anhang-12/control-3-adjusts-100-for-the-decrescendo]
    logic: composition-of-stated-mechanisms
    scope: welte-t100
    holds: PROBABLE
  - id: forz-f-is-throttle-99
    kind: inference
    locator: "pp. 210–211, against hagmann-1984 p. 100 note 32"
    holder: pfeffer-niels
    subject: phillips-adjuster-forz-f
    property: identified-with
    object: drossel-99
    premises: [forz-f-sets-the-fast-closing, hagmann-1984/conduit-23-adjusted-at-99]
    logic: composition-of-stated-mechanisms
    scope: welte-t100
    holds: PROBABLE
  - id: forz-p-is-throttle-96
    kind: inference
    locator: "pp. 210–211, against hagmann-1984 p. 100"
    holder: pfeffer-niels
    subject: phillips-adjuster-forz-p
    property: identified-with
    object: drossel-96
    premises: [forz-p-sets-the-fast-opening, hagmann-1984/throttle-96-admits-air-to-the-bellows]
    logic: composition-of-stated-mechanisms
    scope: welte-t100
    holds: PROBABLE
    note: >
      The project's guess and nobody's statement: throttle 96 is the reopening assist after a
      sforzando, which is what a "fast opening speed" adjuster would set, but no source
      names an adjuster on it. Weaker than the three above and held at the same value only
      because the vocabulary has nothing between PROBABLE and UNKNOWN.

  - id: thesis-is-about-the-t100
    kind: report
    locator: "pp. 209–230"
    subject: phillips-2016-thesis
    property: is-about
    object: welte-t100
    holds: TRUE
    adopt: true
  - id: thesis-is-about-the-licensee
    kind: report
    locator: "p. 221, Table 4.3"
    subject: phillips-2016-thesis
    property: is-about
    object: welte-licensee
    holds: TRUE
    adopt: true
  - id: thesis-is-about-the-green-welte
    kind: report
    locator: "p. 221, Table 4.2"
    subject: phillips-2016-thesis
    property: is-about
    object: welte-t98
    holds: TRUE
    adopt: true

  - id: rest-state-is-the-softest
    kind: report
    locator: "p. 211"
    quote:
      en: "in the absence of other expression data, the pneumatic will always open slowly until it reaches a stationary point, typically when it is fully open. At this point, the suction level applied to the player action is at its lowest, giving the softest playing."
    subject: nuancierbalg-90
    property: rest-state
    object: state-piano
    scope: welte-t100
    holds: TRUE
    adopt: true
    note: >
      A second witness, with the Leseregeln chapter, for the default state being the
      quietest point, reached from the resting circuit rather than from the roll.

  - id: closing-draws-opening-admits-air
    kind: report
    locator: "p. 211"
    quote:
      en: "To achieve a slow closing speed, the expression pneumatic is connected to a regulated suction source (vacuum pump, regulated at the pump) via a restriction in the form of a small aperture of adjustable size, also called an adjustable bleed. […] The opening speed of the pneumatic is similarly controlled, except the pneumatic is now connected to atmosphere via either the smaller or larger aperture."
    subject: nuancierbalg-90
    property: opening-and-closing-agency
    object: air-and-spring-open-suction-closes
    scope: welte-t100
    holds: TRUE
    adopt: false
    comprehension: >
      He gives the halves of the asymmetry the graph already holds from Hagmann, closing on
      suction and opening on atmosphere, and he does not mention an internal spring. Recorded
      against the same concept because the concept's load-bearing half is that reopening
      does not scale with the supply vacuum, which is his claim too. Not adopted, since the
      spring is Hagmann's and not his.

  - id: decrescendo-bleed-is-always-open
    kind: report
    locator: "p. 211"
    quote:
      en: "In practice, the expression pneumatic is always connected to atmosphere via the adjustable aperture Crescendo P in Figure 4.1. As a result, in the absence of other expression data, the pneumatic will always open slowly until it reaches a stationary point, typically when it is fully open. At this point, the suction level applied to the player action is at its lowest, giving the softest playing."
    subject: nuancierbalg-90
    property: decrescendo-leak-is-permanent
    object: stated
    scope: welte-t100
    holds: TRUE
    adopt: false
    note: >
      A second witness for `brougher-welte-regulation/decrescendo-leak-is-permanent`, and an
      independent one: Brougher reaches it as a rebuilder's tolerance for leaky valves,
      Phillips as a description of the resting circuit. Both say the decrescendo aperture
      dumps while the crescendo draws, which the project's model does not do. Between the two
      of them this is now the reading with more witnesses than the model's, and the fitted
      crescendo target sitting at 0.83 and 0.88 rather than at closure is what it would
      predict.

  - id: slow-crescendo-cannot-fully-close
    kind: observation
    locator: "p. 211"
    quote:
      en: "A fourth stationary position for the expression pneumatic is the point it reaches when instructed to close slowly (slow crescendo). The relatively small size of the aperture allowing the pneumatic to be exhausted prevents it from fully closing due to external forces on the pneumatic. This position is not referred to in Welte instructions, but can be observed on an original instrument."
    subject: function-crescendo-on
    property: asymptote
    object: short-of-full-closure
    scope: welte-t100
    holds: TRUE
    adopt: true
    note: >
      The strongest external support in this graph for the fitted crescendo asymptote, and
      the only witness who says he watched it happen on an original instrument. It agrees
      with `pfeffer-leseregeln/crescendo-saturates-below-full-closure` about the fact and differs about
      the cause: Phillips blames external forces on the bellows working against a small
      aperture, Brougher the permanently open decrescendo dump. Both mechanisms would give
      the same ceiling and the roll cannot tell them apart. Worth reading beside
      `gottschewski-1996/ff-ceiling-was-felt-as-a-limitation`, which says the editors felt
      the same ceiling from the musical side.
    comprehension: >
      Read as a statement about the end position rather than about the speed. He lists it as
      one of four stationary positions of the pneumatic, which is what makes it an asymptote
      and not a slow approach to full closure.

  - id: welte-literature-gives-no-levels
    kind: report
    locator: "p. 227"
    quote:
      en: "Establishing these settings in the model required judgement, as Welte literature gives no information."
    subject: welte-handbooks-phillips
    property: contains-a-figure-for
    object: not-stated
    holds: TRUE
    adopt: true
    mentions: [state-piano, state-mezzoforte, state-fortissimo, rest-level-piano]
    note: >
      No figure for any of the four stationary levels of the expression pneumatic.
      Independent confirmation of the gap this project works in: Welte's Anhang 12 norms
      every level against a test roll and a marker tone and never states one, and Phillips,
      working from factory handbooks the project has not seen, reports the same absence. It
      is why every level in the graph is either measured off the paper or fitted, and why the
      timings below are worth more than the levels beside them.

  - id: levels-set-by-ear
    kind: report
    locator: "p. 227"
    quote:
      en: "As a guide, I listened to recordings of well-adjusted original instruments"
    subject: phillips-welte-decoder
    property: calibrated-against
    object: recordings-of-well-adjusted-instruments
    holds: TRUE
    adopt: true
    note: >
      The zero level, the mezzoforte level and the maximum of his model were set by ear.
      That is what the model's levels rest on, and it is not a measurement of a Welte.

  # -- the Mezzoforte hook -----------------------------------------------------

  - id: hook-blocks-whichever-face-is-met
    kind: report
    locator: "p. 211"
    quote:
      en: "When pneumatic G is closed, the metal tab S on the top of the expression pneumatic will engage with tab H, which is now lowered into position. The effect is to either prevent the expression pneumatic from fully opening or fully closing, depending on the side by which tab S is engaged."
    subject: mezzofortebalg-93
    property: blocks-in-directions
    object: both-directions
    scope: welte-t100
    holds: TRUE
    adopt: true
    comprehension: >
      "Either […] or […] depending on the side by which tab S is engaged" is the two-sided
      reading stated without ambiguity, and it also says how the sides are decided: by which
      face the tab meets, once, on engagement. That is the hysteresis the emulator's
      `limitAtStop` implements, described here rather than inferred from code.
    note: >
      A third witness for `mfTwoSided`, after Welte's own sentence quoted in Hagemann 2001
      and Hagmann's "Oeffnung oder Schliessung", and the only one of the three that is not a
      translation question. Roll 3309 cannot test the upward direction at all.

  - id: hook-capture-difference-measured
    kind: measurement
    locator: "p. 227"
    quote:
      en: "Another consideration is the side of the hook by which the expression pneumatic is engaged. Measurements from an original instrument show a difference of 0.5 inches WG, due to the thickness of the metal tab."
    subject: mezzofortebalg-93
    property: hook-capture-vacuum-difference
    value: 12.7
    unit: mm-water-column
    holds: TRUE
    adopt: false
    note: >
      The first measured value for this quantity in the graph. Brougher gives only a
      regulating tolerance, that the two readings should differ by no more than 1½ to 2
      inches; Hagemann says the readings differ and gives no figure; the project measures two
      arrest levels a pin thickness apart on the paper. Phillips's 0.5 inches sits at a
      quarter of Brougher's allowance, which is what one would expect of a measurement
      against a limit. The conversion from his inches is the project's and exact; his figure
      is verbatim in the quotation. He does not name the instrument, so the reading rests on
      one unidentified machine.

  - id: hook-reading-depends-on-approach
    kind: report
    locator: "p. 227"
    subject: mezzofortebalg-93
    property: reading-depends-on-approach
    object: stated
    holds: TRUE
    adopt: true
    quote:
      en: "Another consideration is the side of the hook by which the expression pneumatic is engaged."
    note: >
      A third witness, with Hagemann 2001 and Brougher, and the only one who attributes the
      difference to a cause: the thickness of the metal tab. That is the same cause the
      project reads off Anhang 13 as a plain downward finger rather than a notch.

  - id: treble-hook-set-higher-than-bass
    kind: report
    locator: "p. 227"
    quote:
      en: "Another critical setting in a Welte-Mignon is the position of the mezzoforte hooks, in which the treble hook is positioned so that the treble expression pneumatic travels slightly further than the bass expression pneumatic. Therefore, the suction level at the mezzoforte hook position is slightly higher for the treble side than the bass side."
    subject: mezzofortebalg-93
    property: hook-offset-between-halves
    object: treble-set-to-travel-further
    scope: welte-t100
    holds: TRUE
    adopt: true
    note: >
      The sign of a difference this project measures without having predicted it. Roll 3309
      arrests at 0.627 of the piano-to-forte travel in the bass and 0.645 in the treble, the
      treble the further of the two, which is what Phillips says regulating practice put
      there; that reading of the roll is entered in `roll-3309-observations` against the
      same question. Two machines, two methods, and the asymmetry falls the same way. The
      object is a direction and not a figure, because "slightly further" is all he says.

  - id: halves-differ-at-the-zero-level
    kind: measurement
    locator: "p. 228"
    quote:
      en: "In the model, the minimum playing level of the treble expression is around twelve MIDI steps higher than the bass expression, which the waveforms show agrees with the settings of Hall's Welte-Mignon."
    subject: phillips-welte-decoder
    property: parameter-value
    value: 12
    unit: midi-velocity
    holds: TRUE
    adopt: false
    note: >
      A setting of his model rather than a measurement of a Welte, checked against a
      recording of Denis Hall's 1921–22 Welte-Mignon Steinway O by comparing waveforms. It is
      the quantity Welte's own Kontrolle 2c calls a "trifle" and adjusts at the hook, and
      twelve steps is by his own p. 226 argument the change worth about 3 dB, that is the
      smallest one he takes to be discernible. So "a trifle softer" comes out as the smallest
      audible difference and not as an imperceptible one.

  - id: hammer-weight-explains-the-halves
    kind: inference
    locator: "pp. 215–216 and p. 227, against welte-anhang-12 Kontrolle 2c"
    holder: pfeffer-niels
    subject: mezzofortebalg-93
    property: hook-offset-compensates-for
    object: hammer-weight-difference-between-halves
    premises:
      - velocity-depends-on-hammer-weight
      - treble-hook-set-higher-than-bass
      - welte-anhang-12/control-2c-hook-balances-the-halves
      - welte-anhang-12/control-2c-balances-for-loudness
    logic: composition-of-stated-mechanisms
    scope: welte-t100
    holds: PROBABLE
    adopt: false
    note: >
      Welte's Kontrolle 2c balances the two halves for loudness at mezzoforte by moving the
      hook at 93. Phillips measures that for one and the same suction the lighter treble
      hammers give some twelve more MIDI velocity steps than middle C and seventeen more than
      the bass, and reports that the treble hook is set to travel further, which raises the
      treble suction further still. The two do not cancel, they compound, so the reconciling
      reading is that the hook offset is what pays for the difference in hammer weight
      between the two halves of the keyboard, given that Welte's test is a test of what is
      heard. Held PROBABLE: it composes statements none of which was made with the others
      in view, and Phillips measured hammer weight by eye rather than on a balance.

  # -- the travel times, which are what this source is for ---------------------

  - id: slow-crescendo-t100
    kind: measurement
    locator: "p. 221, Table 4.1"
    quote:
      en: "Slow crescendo, travel from zero to mezzoforte hook · Bass regulator 2.38 seconds · Treble regulator 2.38 seconds"
    subject: nuancierbalg-90
    property: traversal-time-slow-crescendo
    value: 2380
    unit: millisecond
    scope: welte-t100
    holds: TRUE
    adopt: false
    mentions: [phillips-welte-mignon-test-roll]
    note: >
      Zero to the hook, the same span Brougher times at 2.5 s and the roll gives 1072 ms over
      a shorter one. Phillips is within 5 % of Brougher, which is closer than either is to
      the other numbers in this register, and unlike Brougher he is scoped to the T-100
      rather than to the Licensee and Original together. Measured off the MIDI file of the
      Welte-Mignon test roll, so the figure is the test roll's requirement rather than any
      instrument's behaviour. The project's fitted model gives 2273 ms in the bass and
      3177 ms in the treble over the same span.

  - id: slow-decrescendo-t100
    kind: measurement
    locator: "p. 221, Table 4.1"
    quote:
      en: "Slow decrescendo, travel from mezzoforte hook to zero · Bass regulator 2.38 seconds · Treble regulator 2.38 seconds"
    subject: nuancierbalg-90
    property: traversal-time-slow-decrescendo
    value: 2380
    unit: millisecond
    scope: welte-t100
    holds: TRUE
    adopt: false
    mentions: [phillips-welte-mignon-test-roll]
    note: >
      Against Brougher's 2.0 s over the same span, and 19 % slower. The four cells of Table
      4.1 that cover the slow states all read 2.38, bass and treble alike, which is the
      finding rather than an artefact of rounding: he reports the fast rows to the
      millisecond and separates the halves there.

  - id: fast-crescendo-full-stroke-t100
    kind: measurement
    locator: "p. 221, Table 4.1"
    quote:
      en: "Fast crescendo, travel from zero to maximum · Bass regulator 700 milliseconds · Treble regulator 700 milliseconds"
    subject: nuancierbalg-90
    property: traversal-time-fast-crescendo-full-stroke
    value: 700
    unit: millisecond
    scope: welte-t100
    holds: TRUE
    adopt: false
    mentions: [phillips-welte-decoder]
    note: >
      Deliberately not entered against `traversal-time-fast-crescendo`, where Brougher's
      100 ms, midi2exp's 170 to 200 ms and the roll's 211 ms all measure from the piano rail
      to the hook. Phillips's span is the whole stroke, so the two are not in disagreement and
      must not be made to look as though they were. How much further the whole stroke is
      cannot be settled here: on the roll the hook arrests at 0.63 of the piano-to-forte
      travel, which would make it about 1.6 times, but the forte rail and the fully closed
      position need not be the same place. Even at 1.6 his 700 ms is three to four times
      midi2exp's figure and the roll's, and seven times Brougher's, so it is slower than a
      constant rate over the extra distance would give.

  - id: fast-decrescendo-full-stroke-t100
    kind: measurement
    locator: "p. 221, Table 4.1"
    quote:
      en: "Fast decrescendo, travel from maximum to zero · Bass regulator 150 milliseconds · Treble regulator 156 milliseconds"
    subject: nuancierbalg-90
    property: traversal-time-fast-decrescendo-full-stroke
    lower: 150
    upper: 156
    unit: millisecond
    scope: welte-t100
    holds: TRUE
    adopt: false
    mentions: [phillips-welte-decoder]
    note: >
      The two ends are the bass and the treble regulator, not an error bar; neither is an
      estimate of the other. This is the first figure for the fast decrescendo anywhere in the
      graph. Brougher gives it no time at all, only "instantly"; midi2exp sets 400 ms; the
      roll measures 55 ms in the bass and 62 ms in the treble over a partial span. Phillips's
      full stroke at 150 ms sits between the roll's partial span and midi2exp's constant, and
      it is the only one of the three that comes with a stated span.

  - id: fast-times-came-from-the-model
    kind: assessment
    locator: "p. 212 and p. 220"
    holder: pfeffer-niels
    about: phillips-welte-decoder
    quote:
      en: "there were time intervals that could not be resolved, such as the times taken for the expression pneumatic to fully open or to fully close at the fast speed settings […] Once the model was adjusted according to the test roll, it was possible to make accurate timing measurements of all movements associated with the expression pneumatic."
    gloss: >
      The slow times in Tables 4.1 to 4.3 were measured from the MIDI files of the test
      rolls; the fast ones could not be, and were read off the analogue model's oscilloscope
      after the model had been adjusted to satisfy the test roll's pass criteria. So the two
      halves of each table have different provenance, and the fast figures are only as good
      as the criteria: tests 4, 5 and 6 say where the blade must arrive, not how long it may
      take.
    holds: PROBABLE
    note: >
      Recorded as a provenance assessment and not as a criticism. Phillips is explicit about
