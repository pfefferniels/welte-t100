# pianolatron is in this graph as a witness with one specific standing: it is a port.
# Where it agrees with midi2exp that is descent, not corroboration, and the graph should
# never let the two be counted as two independent sources.

source:
  id: pianolatron
  kind: software
  title: "pianolatron"
  authors: [sul-cidr]
  identifier: "branch develop, fetched 2026-08-31"
  url: "https://github.com/sul-cidr/pianolatron"
  note: >
    Stanford Libraries' in-browser player for the SUPRA scans. Its expression code carries
    midi2exp's constants without midi2exp's annotations, so the provenance audit in
    `midi2exp.yaml` applies to it at one further remove.

statements:

  - id: is-a-port-of-midi2exp
    kind: report
    locator: "commit introducing the welte-red expressionizer"
    quote:
      en: "Calculate expressionized velocities for welte-red — This cribbed and clipped from Peter's code, with only minor amendments."
    subject: pianolatron-source
    property: derives-from
    object: midi2exp-source
    holds: TRUE
    adopt: true
    note: >
      Said by its own introducing commit. Everything the two agree about is one belief held
      twice, not two beliefs.

  - id: integrates-segment-wise
    kind: report
    locator: "in-app-expressionizer.js:264-315, welte-red.js:49-125"
    subject: pianolatron-source
    property: control-principle
    object: rates-not-levels
    holds: TRUE
    adopt: false
    note: >
      Where it does differ from midi2exp it differs materially. Pianolatron evaluates the
      model only at control-hole times and draws a straight line between consecutive
      evaluations, so clamping applies at segment endpoints rather than along the path and
      any saturation inside a segment is lost. On a worked fast crescendo the two give 47.50
      against 51.67 at t = 200 ms and 56.87 against 59.999 at t = 350 ms: a discrepancy of
      three to four velocity units on exactly the attacks that carry the most musical weight.

  - id: tracker-diameter-from-phillips
    kind: report
    locator: "welte-licensee.js:18"
    holder: phillips-peter
    transmitted_by: [sul-cidr]
    quote:
      en: "P. Phillips: .5 mm smaller than Welte-Mignon"
    subject: parameter-tracker-diameter-licensee
    property: tracker-bore-diameter
    value: 10.8
    unit: pixel
    scope: welte-licensee
    holds: TRUE
    adopt: false
    note: >
      The only provenance note in the whole repository, and it is about the Welte-Licensee
      scale rather than the T-100. Apparently a personal communication. Recorded because a
      single attributed number in a repository of unattributed ones is itself a finding
      about how the two projects were built.

  - id: licensee-diameter-follows-from-the-red-one
    kind: inference
    locator: "welte-licensee.js:18, against midi2exp Expressionizer.h:120 and Phillips p. 180"
    holder: pfeffer-niels
    subject: parameter-tracker-diameter-licensee
    property: tracker-bore-diameter
    value: 10.8
    unit: pixel
    scope: welte-licensee
    premises:
      - midi2exp/tracker-diameter-red-px
      - phillips-2016/welte-tracker-holes-are-uniform
      - phillips-2016/licensee-holes-half-a-millimetre-shorter
    logic: arithmetic
    holds: TRUE
    note: >
      16.7 px less 0.5 mm at 300.25 px per inch is 16.7 − 5.91 = 10.79 px, which to the
      one decimal pianolatron uses is the 10.8 it carries. So the one attributed constant in
      the repository is the published thesis figure applied to midi2exp's red diameter,
      whatever the route by which it arrived.

  - id: defines-licensee-tracker-diameter
    kind: report
    locator: "welte-licensee.js:18"
    subject: parameter-tracker-diameter-licensee
    property: defined-in
    object: pianolatron-source
    holds: TRUE
    adopt: true
  - id: carries-accel
    kind: report
    locator: "welte-red.js:20"
    subject: parameter-accel-ft-per-min2
    property: defined-in
    object: pianolatron-source
    holds: TRUE
    adopt: true
    note: >
      The same constant as midi2exp's, in a second file, without midi2exp's silence being
      any less silent.

  - id: models-the-nuancierbalg
    kind: report
    locator: "welte-red.js:49-125"
    subject: pianolatron-source
    property: models
    object: nuancierbalg-90
    scope: welte-t100
    holds: TRUE
    adopt: true

  - id: cidr-belongs-to-stanford-libraries
    kind: report
    locator: "github.com/sul-cidr, organisation name"
    subject: sul-cidr
    property: member-of
    object: stanford-libraries
    holds: TRUE
    adopt: true
    note: "The Center for Interdisciplinary Digital Research is a unit of the Libraries."
