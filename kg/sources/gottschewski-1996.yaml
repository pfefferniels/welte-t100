# Gottschewski's book is in this graph for three things: a track map that agrees with
# Hagmann's, a statement of the rate principle that the whole model rests on, and a set of
# clean negatives. The negatives are worth as much as the positives, because they stop the
# same search being repeated.
#
# German taken from `emulator/docs/gottschewski.md`, which records which chapter PDFs were
# read and which were not. Quotations here have not been re-verified against the local PDF
# and are marked as second-hand where that matters.

source:
  id: gottschewski-1996
  kind: dissertation
  title: "Die Interpretation als Kunstwerk. Musikalische Zeitgestaltung und ihre Analyse am Beispiel von Welte-Mignon-Klavieraufnahmen von 1905"
  authors: [gottschewski-hermann]
  container: "Freiburger Beiträge zur Musikwissenschaft 5, Laaber"
  year: 1996
  copy: "~/Zotero/storage/YKPB9K2R/Gottschewski - 1996 - Die Interpretation als Kunstwerk…pdf"
  note: >
    He defers the technology to Hagmann explicitly (p. 5) and excludes the dynamics from his
    own reading rules (p. 138: "Nicht berücksichtigt ist die Dynamik, da diese ohne weitere
    Untersuchungen noch nicht vollständig entschlüsselt werden kann"). What he does say
    about the dynamics is therefore incidental, which makes it useful: he is not arguing for
    a position on the latch and so is not shaping the evidence to fit one.

statements:

  - id: rates-not-steps
    kind: report
    locator: "p. 28"
    quote:
      de: "Die Regelung der Anschlagsstärke erfolgt nach einem dynamischen Prinzip … Es gibt also nicht verschiedene Lautstärkestufen, sondern verschiedene Crescendo- und Decrescendostufen, zwischen denen mittels der Steuerspuren umschaltbar ist."
    translation: >
      The regulation of the striking force follows a dynamic principle … There are therefore
      not different loudness steps but different crescendo and decrescendo rates, between
      which the control tracks switch.
    subject: nuancierbalg-90
    property: control-principle
    object: rates-not-levels
    scope: welte-t100
    holds: TRUE
    adopt: true
    note: >
      The model the project fits, stated in 1996. Everything in the pneumatic model follows
      from taking this literally: the control tracks select conductances, and the level is
      whatever the integration of those conductances produces.

