  - id: six-dynamic-tracks-in-order
    kind: report
    locator: "p. 138, Fn. 108"
    quote:
      de: "Die sechs Dynamikspuren haben folgende Funktion (von außen nach innen): Mezzofortearretierung aus – Mezzofortearretierung ein – langsames crescendo aus (d. h. langsames decrescendo) – langsames crescendo ein – plötzliches decrescendo – plötzliches crescendo."
    translation: >
      The six dynamic tracks have the following function, from outside inwards: mezzoforte
      arrest off — mezzoforte arrest on — slow crescendo off (that is, slow decrescendo) —
      slow crescendo on — sudden decrescendo — sudden crescendo.
    subject: function-sforzando-on
    property: latching-behaviour
    object: momentary
    scope: welte-t100
    holds: PROBABLE
    adopt: false
    comprehension: >
      The inference is the project's and Gottschewski would not recognise it as his: he
      never uses the word Sforzando, never mentions Hagmann's claim, and nowhere discusses
      latching. But his naming does carry a structure. The first four tracks are two on/off
      pairs, named as such; the last two are named as two independent functions, "plötzliches
      decrescendo" and "plötzliches crescendo", not as one function and its cancellation.
      Held PROBABLE, and not adopted, because a naming is weak evidence about a valve.
    note: >
      He also distinguishes three things Hagmann's "aufrecht erhalten" runs together: a valve
      that latches; a valve that is momentary while the bellows stays where it got to because
      nothing returns it; and a valve that is momentary with a decaying effect. His account
      is consistent with the second and inconsistent with the first.

  - id: no-piano-recording-rolls-survive
    kind: report
    locator: "p. 41"
    quote:
      de: "Da es keine Klavier-Aufnahmerollen mehr gibt…"
    translation: "Since there are no piano recording rolls any more…"
    subject: welte-recording-roll
    property: survival-status
    object: none-extant
    holds: TRUE
    adopt: true
    note: >
      So the recording process cannot be reconstructed from an example of its output.
      Independent of Hagmann's statement at p. 70 n. 48 that the procedure was never
      described. Two witnesses for two absences, the process and its product, which is why
      the question of what the drawn line on roll 3309 records has to be settled from the
      roll.

  - id: says-nothing-about-drawn-lines
    kind: report
    locator: "Personen- und Sachregister, pp. 324–331, and the chapters read"
    holder: pfeffer-niels
    subject: gottschewski-1996-book
    property: contains-a-figure-for
    object: not-stated
    holds: TRUE
    logic: absence-in-a-searched-index
    mentions: [drawn-expression-lines]
    note: >
      A clean negative on three grounds. There is no index entry for Nuancierung,
      Nuancierungslinie, Nuancierbalg or anything similar. He uses Nüance and Nüancierung
      only in the ordinary musical sense, at pp. 28 and 37, never as a term for a mechanism.
      And he handled late rolls in the tempo chapter, including Nr. 3315, six numbers from
      3309, and describes no markings, lines or printed scale on any of them. So the
      second-hand report that he has said something about the drawn lines cannot be confirmed
      or corrected from his published work; only the 2024 Sydney paper can settle it.

  - id: no-number-for-mezzoforte
    kind: report
    locator: "Personen- und Sachregister, pp. 324–331, and the chapters read"
    holder: pfeffer-niels
    subject: gottschewski-1996-book
    property: contains-a-figure-for
    object: not-stated
    holds: TRUE
    logic: absence-in-a-searched-index
    mentions: [mf-position-on-scale, gridline-mf, position-to-vacuum-relation]
    note: >
      Nothing anywhere in the book gives a figure for where mezzoforte sits, or says anything
      about the printed P.P. / M.F. / F.F. scale, or about the linearity of loudness against
      bellows travel or against vacuum. He discusses linearity at length, but always of paper
      speed. The quantities the negative is about are the mentions.

  - id: widerstand-has-no-disturbing-effect
    kind: report
    locator: "p. 28, Fn. 26"
    quote:
      de: "hat keine störenden Auswirkungen auf das System"
    subject: function-widerstand-on
    property: controls-function
    object: no-disturbing-effect
    scope: welte-t100
    holds: TRUE
    adopt: false
    contradicts: [hagmann-1984/widerstand-is-blower-two-speed]
    note: >
      He reads tracks 9–10 as an electrical resistance that only reduces motor noise in
      low-demand passages. Hagmann reads the same two lines as a two-speed blower control
      and expects its removal on the T-98 to flatten accents. The project's own count — the
      lines are worked twenty-two times at musical junctures on 3309 — favours Hagmann, but
      the ablation finds that giving the model a wind term buys nothing, which favours
      Gottschewski. The disagreement is unresolved and neither side is adopted.

