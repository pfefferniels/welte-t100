    object: state-fortissimo
    scope: welte-t100
    holds: TRUE
    adopt: true
    note: >
      What he saw on the 1905 rolls: every octave tripling stands at a fortissimo or at a
      strong accent. The observation, kept apart from what he makes of it.

  - id: ff-ceiling-was-felt-as-a-limitation
    kind: report
    locator: "p. 151"
    quote:
      de: "kann vermutet werden, daß auch hier ein Mangel der Wiedergabe kompensiert werden sollte: die obere Grenze für den ff-Anschlag."
    translation: >
      it may be supposed that here too a shortcoming of the reproduction was to be
      compensated: the upper limit of the ff blow.
    subject: octave-tripling
    property: compensates-for
    object: ff-ceiling
    scope: welte-t100
    holds: PROBABLE
    adopt: true
    note: >
      His own conjecture, stated as one. It is independent evidence that the ceiling was felt
      as a limitation by the editors, which is worth having beside a fit that puts the
      crescendo's asymptote short of full closure.

  - id: defers-technology-to-hagmann
    kind: report
    locator: "p. 5"
    quote:
      de: "Auf eine Einführung in die Geschichte und Technik des Welte-Mignon-Verfahrens wurde … verzichtet; der interessierte Leser möge die im Literaturverzeichnis genannte Arbeit von Peter Hagmann zu Rate ziehen."
    subject: gottschewski-1996-book
    property: derives-from
    object: hagmann-1984-book
    holds: TRUE
    adopt: true
    note: >
      For the technology, and only for that. Worth recording because it means Gottschewski
      is not an independent witness for anything he takes from Hagmann. Where he agrees with
      Hagmann, that is descent and not corroboration; where he differs, as over the
      Widerstand and over the last two dynamic tracks, the difference is his own.

