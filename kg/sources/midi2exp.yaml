# midi2exp, the Stanford expression emulator, read as a source rather than as a tool.
#
# Its constants are beliefs about the T-100 held by whoever set them, and §F of
# `emulator/docs/prior-art.md` is a provenance audit of every one that claims a
# measurement. Three of the statements below are that audit, recorded as I15 Provenance
# Assessments: what a source does not say about where its numbers came from is a finding.

source:
  id: midi2exp
  kind: software
  title: "midi2exp"
  authors: [pianoroll-project]
  identifier: "commit 8f50e78"
  url: "https://github.com/pianoroll/midi2exp"
  note: >
    Authorship of individual constants is not recoverable from the repository. Where a
    comment names someone, the graph names them; otherwise the holder is the project group,
    which is what the source supports. Every rate below is expressed in MIDI velocity units
    per millisecond, which silently asserts that MIDI velocity is linear in pneumatic travel
    and that travel is linear in hammer speed. Neither holds, and it is why this project
    works in bellows travel and maps to velocity only at note onset.

statements:

  - id: welte-p
    kind: report
    locator: "Expressionizer.h, welte_p"
    subject: parameter-welte-p
    property: parameter-value
    value: 35
    unit: midi-velocity
    holds: TRUE
    adopt: false

  - id: welte-mf
    kind: report
    locator: "Expressionizer.h, welte_mf"
    subject: parameter-welte-mf
    property: parameter-value
    value: 60
    unit: midi-velocity
    holds: TRUE
    adopt: false

  - id: welte-f
    kind: report
    locator: "Expressionizer.h, welte_f"
    subject: parameter-welte-f
    property: parameter-value
    value: 90
    unit: midi-velocity
    holds: TRUE
    adopt: false

  - id: mezzoforte-position
    kind: inference
    locator: "emulator/src/model/midi2exp.ts:9-13"
    holder: pfeffer-niels
    subject: parameter-welte-mf
    property: mf-position-on-velocity-span
    value: 0.4545
    unit: velocity-span-fraction
    premises: [welte-p, welte-mf, welte-f]
    logic: arithmetic
    holds: TRUE
    note: >
      welte_mf sits 0.4545 of the way from welte_p to welte_f. Every rule in midi2exp is
      affine, so running it in scale units with mf at that value reproduces it exactly.
      The unit is deliberately not the one Hagmann's "auf halbem Wege" is in. This is a
      fraction of a *MIDI velocity* span; his is a fraction of bellows travel; the roll's
      printed gridline is a position on paper. Treating the three as comparable assumes that
      velocity is linear in travel and travel linear in hammer speed, and neither holds. The
      graph records all three and refuses to convert between them, which is the honest
      position: midi2exp's 0.4545, the paper's 0.5 and the measured 0.627 / 0.645 disagree,
      and part of the disagreement is that they are not measurements of the same thing.

  - id: slow-decay-rate
    kind: report
    locator: "Expressionizer.cpp:60, Expressionizer.h:215"
    subject: parameter-slow-decay-rate
    property: linear-rate-denominator
    value: 2380
    unit: millisecond
    holds: TRUE
    adopt: false
    supersedes: [slow-decay-rate-earlier]
    note: >
      Normalised over the welte_p → welte_mf span of 25 velocity units. No measurement is
      quoted anywhere for it; the header carries a bare `//2380` and a commented-out
      alternative `2380.0 * 2.0`.

  - id: fast-crescendo-rate
    kind: report
    locator: "Expressionizer.cpp:61, Expressionizer.h:216"
    subject: parameter-fast-crescendo-rate
    property: linear-rate-denominator
    value: 300
    unit: millisecond
    holds: TRUE
    adopt: false
    supersedes: [fast-crescendo-rate-earlier]

  - id: fast-crescendo-quoted-measurement
    kind: report
    locator: "Expressionizer.h:216, comment"
    quote:
      en: "test roll shows around 170ms-200ms from min to MF hook"
    subject: state-fast-crescendo
    property: traversal-time
    lower: 170
    upper: 200
    unit: millisecond
    holds: TRUE
    adopt: false
    mentions: [midi2exp-test-roll]
    contradicts: [fast-crescendo-rate]
    note: >
      A different quantity from the constant it sits next to, and that is the trap. This is a
      measured traversal time from the minimum to the MF hook; `fast_crescendo_rate` is the
      denominator of a linear rate, which produces exactly that traversal only if the ramp is
      linear. The roll says it is not. Even setting that aside, the shipped 300 ms is 50 to
      75 % above the measurement the comment quotes, and no note says why.

  - id: fast-decrescendo-rate
    kind: report
    locator: "Expressionizer.cpp:62, Expressionizer.h:217"
    subject: parameter-fast-decrescendo-rate
    property: linear-rate-denominator
    value: 400
    unit: millisecond
    holds: TRUE
    adopt: false
    supersedes: [fast-decrescendo-rate-earlier]
    note: >
      Normalised over welte_p → welte_f, a span of 55 units, where the two crescendo rates
      are normalised over 25. So changing welte_f changes the fast-decrescendo slope and
      leaves the fast-crescendo slope alone, which is a coupling nothing in the mechanism
      suggests.

  - id: fast-decrescendo-quoted-measurement
    kind: report
    locator: "Expressionizer.h:217, comment"
    quote:
      en: "test roll shows 166ms — 300ms at max 400ms fast decrescendo can bring Max down to Min"
    subject: nuancierbalg-90
    property: traversal-time-fast-decrescendo-full-stroke
    lower: 166
    upper: 300
    unit: millisecond
    scope: welte-t100
    holds: TRUE
    adopt: false
    mentions: [midi2exp-test-roll]
    contradicts: [fast-decrescendo-rate]
    note: >
      Maximum to minimum is the whole stroke, which is the span Phillips times at 150 to
      156 ms and not the partial span the roll's 55 to 62 ms covers. The shipped 400 ms sits
      above the top of the range the comment quotes, as the fast crescendo's 300 ms does
      above its own.

  # -- what the constants were before ---------------------------------------------
  #
  # The header keeps its own version history under the headings "before 0411" and
  # "experiment 0411", so the earlier values are beliefs the project once held and later
  # revised, and each current value supersedes them. The mapping of the three crescendo
  # values onto the two headings is not recoverable from the file; the order is.

  - id: fast-crescendo-rate-earliest
    kind: report
    locator: "Expressionizer.h:203-222, version history"
    subject: parameter-fast-crescendo-rate
    property: linear-rate-denominator
    value: 700
    unit: millisecond
    holds: TRUE
    adopt: false
  - id: fast-crescendo-rate-earlier
    kind: report
    locator: "Expressionizer.h:203-222, version history"
    subject: parameter-fast-crescendo-rate
    property: linear-rate-denominator
    value: 1050
    unit: millisecond
    holds: TRUE
    adopt: false
    supersedes: [fast-crescendo-rate-earliest]
  - id: fast-decrescendo-rate-earlier
    kind: report
    locator: "Expressionizer.h:203-222, version history"
    subject: parameter-fast-decrescendo-rate
    property: linear-rate-denominator
    value: 330
    unit: millisecond
    holds: TRUE
    adopt: false
  - id: slow-decay-rate-earliest
    kind: report
    locator: "Expressionizer.h:203-222, version history"
    subject: parameter-slow-decay-rate
    property: linear-rate-denominator
    value: 9520
    unit: millisecond
    holds: TRUE
    adopt: false
  - id: slow-decay-rate-earlier
    kind: report
    locator: "Expressionizer.h:203-222, version history"
    subject: parameter-slow-decay-rate
    property: linear-rate-denominator
    value: 4760
    unit: millisecond
    holds: TRUE
    adopt: false
    supersedes: [slow-decay-rate-earliest]

  - id: accel-constant
    kind: report
    locator: "midi2exp.cpp:103; pianolatron welte-red.js:20"
    subject: parameter-accel-ft-per-min2
    property: parameter-value
    value: 0.3147
    unit: dimensionless
    holds: TRUE
    adopt: false

  - id: sforzando-is-momentary
    kind: report
    locator: "Expressionizer.cpp, pass 1 valve decoding"
    subject: function-sforzando-on
    property: latching-behaviour
    object: momentary
    scope: welte-t100
    holds: TRUE
    adopt: false
    note: >
      Implemented rather than argued: the model applies the fast crescendo only while the
      perforation is open. No comment anywhere in either repository defends the choice
      against Hagmann's account, and it is not clear the authors knew of it.

  - id: models-the-nuancierbalg
    kind: report
    locator: "Expressionizer.cpp, pass 2"
    subject: midi2exp-source
    property: models
    object: nuancierbalg-90
    scope: welte-t100
    holds: TRUE
    adopt: true
    note: >
      As a ramp generator in MIDI velocity: the level is integrated one millisecond at a
      time from the decoded valve states, which is a model of the bellows even though no
      bellows is named.

  - id: tracker-diameter-red-mm
    kind: report
    locator: "Expressionizer.h:120"
    subject: parameter-tracker-diameter
    property: tracker-bore-diameter
    value: 1.413
    unit: millimetre
    scope: welte-t100
    holds: TRUE
    adopt: false
    note: >
      Given in the header as 1.413 mm and converted there to 16.7 px at the 300.25 dpi of
      the Stanford scan. No source is cited for the millimetre figure.

  - id: tracker-diameter-red-px
    kind: report
    locator: "Expressionizer.h:120; midi2exp.cpp:30"
    subject: parameter-tracker-diameter
    property: tracker-bore-diameter
    value: 16.7
    unit: pixel
    scope: welte-t100
    holds: TRUE
    adopt: false

  - id: extends-every-hole
    kind: report
    locator: "Expressionizer.cpp:1868-1892, applyTrackBarWidthCorrection"
    subject: midi2exp-source
    property: effective-perforation-length
    object: longer-than-punched
    scope: welte-t100
    holds: TRUE
    adopt: false
    note: >
      The same phenomenon the Leseregeln chapter states and Phillips measured, treated as a
      fixed extension of every hole's tail and of no hole's start.

  - id: hole-extension-fraction
    kind: report
    locator: "midi2exp.cpp:29; Expressionizer.cpp:1878"
    subject: midi2exp-source
    property: perforation-tail-extension
    value: 0.75
    unit: tracker-diameter
    scope: welte-t100
    holds: TRUE
    adopt: false
    note: >
      Rounded to 13 ticks at 16.7 px; pianolatron truncates the same product to 12.

