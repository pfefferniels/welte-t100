  - id: accel-provenance-not-stated
    kind: observation
    locator: "midi2exp.cpp:103; pianolatron welte-red.js:20"
    holder: pfeffer-niels
    subject: parameter-accel-ft-per-min2
    property: has-stated-provenance
    object: not-stated
    holds: TRUE
    note: >
      The proposition the assessment below is about, as a plain observation of the two
      repositories: no comment at either place.
  - id: slow-decay-provenance-not-stated
    kind: observation
    locator: "Expressionizer.h:215"
    holder: pfeffer-niels
    subject: parameter-slow-decay-rate
    property: has-stated-provenance
    object: not-stated
    holds: TRUE
    note: "A bare `//2380` and a commented-out `2380.0 * 2.0`, and nothing else."
  - id: fast-crescendo-provenance-stated
    kind: observation
    locator: "Expressionizer.h:216"
    holder: pfeffer-niels
    subject: parameter-fast-crescendo-rate
    property: has-stated-provenance
    object: stated
    holds: TRUE
    mentions: [midi2exp-test-roll]
    note: >
      Stated, and unusable: "the test roll", unnamed. The value shipped is not the value the
      comment quotes.
  - id: fast-decrescendo-provenance-stated
    kind: observation
    locator: "Expressionizer.h:217"
    holder: pfeffer-niels
    subject: parameter-fast-decrescendo-rate
    property: has-stated-provenance
    object: stated
    holds: TRUE
    mentions: [midi2exp-test-roll]
  - id: test-roll-is-unnamed
    kind: observation
    locator: "emulator/docs/prior-art.md §F"
    holder: pfeffer-niels
    subject: midi2exp-test-roll
    property: has-stated-provenance
    object: not-stated
    holds: TRUE
    note: >
      No scan, druid or edition anywhere in either repository. Whether it is the Skalarolle
      Welte 17 describes cannot be said.

  - id: broadwell-belongs-to-the-project
    kind: report
    locator: "Expressionizer.cpp:891, 1136, 1345; commit 6a29060"
    holder: pfeffer-niels
    subject: broadwell-peter
    property: member-of
    object: pianoroll-project
    holds: PROBABLE
    note: >
      Credited by first name for the velocity mapping and the author of the acceleration
      commit. That makes him a contributor; whether the repository's group is the right
      thing to call him a member of is the project's reading of a commit log.

  # -- what the audit found about where these numbers come from ----------------

  - id: accel-has-no-provenance
    kind: assessment
    locator: "emulator/docs/prior-art.md §F"
    holder: pfeffer-niels
    about: midi2exp-source
    gloss: >
      The value accelFtPerMin2 = 0.3147, which sets the spool acceleration and so the whole
      time axis, has no stated provenance in either repository. It was introduced in commit
      6a29060 alongside the kinematic model, appears twice in midi2exp and once in
      pianolatron, and carries no comment in any of the three places.
    holds: UNKNOWN
    note: >
      Recorded as a provenance assessment rather than as a criticism. The finding is not that
      the number is wrong but that nothing in the source lets a reader judge it.

  - id: no-test-roll-is-named
    kind: assessment
    locator: "emulator/docs/prior-art.md §F"
    holder: pfeffer-niels
    about: midi2exp-source
    gloss: >
      Nine constants in midi2exp cite a measurement from "the test roll" or "test rolls".
      No Welte test roll is named anywhere in either repository, no scan or druid is given,
      and the measurements themselves are not in either repository. So none of the nine can
      be checked, and the roll that would let them be checked cannot be identified.
    holds: UNKNOWN
    note: >
      This is the most consequential gap in the prior art, because those nine numbers are the
      only empirical content in either emulator, and because a named Skalarolle would also
      turn the whole of Welte's Anhang 12 into seconds.

  - id: constants-were-retuned-away-from-the-measurement
    kind: assessment
    locator: "Expressionizer.h:203-222, version history"
    holder: pfeffer-niels
    about: midi2exp-source
    gloss: >
      The red-Welte rates were retuned repeatedly and away from the measurements the comments
      quote: fast crescendo 700 → 1050 → 300 ms, fast decrescendo 330 → 400 ms, slow decay
      9520 → 4760 → 2380 ms, under the headings "before 0411" and "experiment 0411". Whoever
      tuned them deliberately slowed the two fast rates relative to the test roll and left no
      note saying why.
    holds: TRUE
    note: >
      Held TRUE rather than UNKNOWN because the trajectory is in the file; what is unknown is
      the reason, which is a different proposition and is not asserted here.
