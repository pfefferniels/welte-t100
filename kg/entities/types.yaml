# The vocabulary: what can be said about a thing, in what unit, and by what reasoning.
#
# A property type is the graph's guard against false comparison. Milliseconds appear in
# three of them below and they are not interchangeable: a traversal time measured off a
# test roll, the denominator of a linear rate normalised over some span, and a time
# constant of an exponential are three different quantities that happen to share a unit.

entities:

  # -- bookkeeping concepts the compiler needs ---------------------------------

  - id: mechanism-component
    kind: concept
    label: { en: "component of the Welte mechanism, as designed" }
    note: >
      Component records name a part of the design, identified by Hagmann's drawing number,
      not one physical bellows in one instrument. Where a claim is about a particular
      machine, the subject is that instrument and not the component.
  - id: piano-roll
    kind: concept
    label: { en: "piano roll" }
  - id: musical-work
    kind: concept
    label: { en: "musical work" }
  - id: performance
    kind: concept
    label: { en: "performance" }
  - id: software
    kind: concept
    label: { en: "software" }
  - id: citation-key
    kind: concept
    label: { en: "citation key" }
  - id: url
    kind: concept
    label: { en: "URL" }
  - id: local-copy
    kind: concept
    label: { en: "path to a local copy" }
  - id: source-kind-article
    kind: concept
    label: { en: "journal article" }
  - id: source-kind-dissertation
    kind: concept
    label: { en: "dissertation" }
  - id: source-kind-dissertation-chapter
    kind: concept
    label: { en: "chapter of a dissertation in progress" }
  - id: source-kind-software
    kind: concept
    label: { en: "software repository" }
  - id: source-kind-appendix
    kind: concept
    label: { en: "appendix or plate in a printed work" }
  - id: source-kind-observation-record
    kind: concept
    label: { en: "the project's own record of observations" }
  - id: source-kind-fitting-record
    kind: concept
    label: { en: "the project's own record of a fit" }

  # -- units -------------------------------------------------------------------

  - id: mm-water-column
    kind: unit
    label: { en: "mm water column", de: "mm Wassersäule" }
    note: "Hagemann's unit. Negative values are vacuum below atmosphere."
  - id: mbar
    kind: unit
    label: { en: "mbar" }
  - id: millimetre
    kind: unit
    label: { en: "mm" }
  - id: millisecond
    kind: unit
    label: { en: "ms" }
  - id: second
    kind: unit
    label: { en: "s" }
  - id: scale-unit
    kind: unit
    label: { en: "unit of the roll's printed scale" }
    note: >
      0.0 at the half's own P.P. gridline, 0.5 at its M.F. gridline, 1.0 at the shared
      central F.F. gridline, piecewise linear through M.F. That the M.F. gridline is 0.5 is
      the roll's own claim and not an independent measurement.
  - id: travel-fraction
    kind: unit
    label: { en: "fraction of the P-to-F travel" }
    note: >
      Referred to the two rails the drawn line actually rests at, not to the printed
      gridlines. Removes a common-mode drift of the whole traced line, which is why the
      hook level is far steadier in this unit than in scale units.
  - id: scale-unit-per-second
    kind: unit
    label: { en: "scale units per second" }
  - id: pixel
    kind: unit
    label: { en: "px, on the 300.25 dpi Stanford scan" }
  - id: scan-row
    kind: unit
    label: { en: "scan row" }
    note: "One pixel row of the scan. The SUPRA MIDI's tick is the same quantity."
  - id: midi-velocity
    kind: unit
    label: { en: "MIDI velocity" }
  - id: percent
    kind: unit
    label: { en: "%" }
  - id: notes-per-second
    kind: unit
    label: { en: "notes per second" }
  - id: line-number
    kind: unit
    label: { en: "tracker-bar line number" }
  - id: velocity-span-fraction
    kind: unit
    label: { en: "fraction of the welte_p to welte_f velocity span" }
    note: >
      Kept apart from travel-fraction on purpose. midi2exp expresses every constant in MIDI
      velocity units, which silently asserts that velocity is linear in pneumatic travel and
      travel linear in hammer speed. Giving the two spans one unit would bury that
      assumption in the graph instead of exposing it.
  - id: dimensionless
    kind: unit
    label: { en: "dimensionless" }
    note: >
      For correlation coefficients, exponents and ratios. Declared as a unit rather than
      omitted so that every magnitude in the graph carries one and none can be compared
      across quantities by accident.

  # -- property types ----------------------------------------------------------

  - id: vacuum-at-tone-pneumatic
    kind: property-type
    label: { en: "vacuum measured between Betonungs- and Tonpneumatik" }
    note: >
      The vacuum on the line the expression regulator delivers to the note pneumatics.
      Hagemann taps it by drilling the conduit rails behind the Betonungs- and before the
      Tonpneumatik; Brougher reads it with a gauge put in place of a note tube at the end of
      the stack. The two taps sit on the same line either side of it, and the graph treats
      them as one quantity, which is a judgement and not something either author states.
      Not the same quantity as the vacuum in the relay's wind chamber, which is upstream of
      the cone valve, nor as the blower's Betriebsunterdruck.
      Its narrower terms name the expression state the reading was taken in, because
      I17 One-Proposition Set is binary by design and a state qualifier has nowhere else
      to go.
  - id: vacuum-in-piano
    kind: property-type
    concerns: [state-piano]
    part_of: vacuum-at-tone-pneumatic
    label: { en: "vacuum in the Piano state" }
  - id: vacuum-in-crescendo
    kind: property-type
    concerns: [state-crescendo]
    part_of: vacuum-at-tone-pneumatic
    label: { en: "vacuum in the Crescendo state (Welte's Cresc. F.)" }
  - id: vacuum-in-forte
    kind: property-type
    concerns: [state-forte]
    part_of: vacuum-at-tone-pneumatic
    label: { en: "vacuum in the Forte state (Welte's Forz. F.)" }
  - id: vacuum-in-fortissimo
    kind: property-type
    concerns: [state-fortissimo]
    part_of: vacuum-at-tone-pneumatic
    label: { en: "vacuum in the Fortissimo state (Crescendo and Forte together)" }
  - id: supply-vacuum
    kind: property-type
    concerns: [state-operating-vacuum]
    label: { en: "vacuum of the blower supply (Betriebsunterdruck)" }
  - id: valve-chatter-threshold
    kind: property-type
    concerns: [state-operating-vacuum]
    label: { en: "supply vacuum above which the valves begin to chatter" }
  - id: magazine-bellows-vacuum
    kind: property-type
    label: { en: "vacuum at a magazine bellows" }
  - id: dome-travel
    kind: property-type
    label: { en: "travel of the Nuancierbalg dome for a stated change of vacuum" }
  - id: dome-travel-bass
    kind: property-type
    concerns: [half-bass]
    part_of: dome-travel
    label: { en: "dome travel, bass side, for −100 to −200 mm WS" }
  - id: dome-travel-discant
    kind: property-type
    concerns: [half-treble]
    part_of: dome-travel
    label: { en: "dome travel, discant side, for −100 to −200 mm WS" }
  - id: reading-depends-on-approach
    kind: property-type
    label: { en: "whether the measured value depends on the side the hook is approached from" }
  - id: contains-a-figure-for
    kind: property-type
    label: { en: "whether a source contains any figure for a stated quantity" }
    note: >
      For clean negatives. A source that gives no vacuum figure for the piano is telling
      you something, and the graph should be able to say so without a footnote.

  - id: rest-level-piano
    kind: property-type
    concerns: [state-piano]
    label: { en: "level the drawn line rests at, at the piano rail" }
  - id: rest-level-forte
    kind: property-type
    concerns: [state-forte]
    label: { en: "level the drawn line rests at, at the fortissimo rail" }
  - id: hook-arrest-level
    kind: property-type
    concerns: [state-mezzoforte]
    label: { en: "level the Mezzoforte hook arrests the line at" }
    note: >
      The lower of the pin's two faces on this roll, because all twenty-two engagements are
      entered from above. It is not the pin's centre and not the printed M.F. gridline.
  - id: hook-arrest-level-on-printed-scale
    kind: property-type
    concerns: [state-mezzoforte]
    part_of: hook-arrest-level
    label: { en: "hook arrest level, read on the roll's printed scale" }
  - id: hook-offset-above-printed-mf-upper-bound
    kind: property-type
    concerns: [state-mezzoforte]
    label: { en: "upper bound on how far the hook sits above the printed M.F. gridline" }
    note: >
      A bound, not an estimate. The roll never shows the pin's upper face, so the observed
      offset can only limit the regulated position from above. Recorded as its own property
      type so that no query can mistake it for a measurement of that offset.
  - id: mf-position-on-velocity-span
    kind: property-type
    concerns: [state-mezzoforte]
    part_of: mf-position-on-scale
    label: { en: "where mezzoforte sits on a MIDI velocity span" }
    note: >
      A narrower term, and not interchangeable with its siblings: a fraction of a velocity
      span becomes a fraction of bellows travel only if velocity is linear in travel, which
      is exactly what is in dispute.
  - id: mf-position-on-scale
    kind: property-type
    concerns: [state-mezzoforte]
    label: { en: "where mezzoforte is taken to sit on the dynamic scale" }
    note: >
      Deliberately vague about which scale, because the sources are: the roll's printed
      gridline is a position on paper, midi2exp's welte_mf a MIDI velocity, and the measured
      arrest a bellows position. Comparing them is an argument, not a lookup.

  - id: time-constant
    kind: property-type
    label: { en: "time constant of an exponential approach" }
  - id: asymptote
    kind: property-type
    label: { en: "asymptote a state relaxes towards" }
  - id: traversal-time
    kind: property-type
    label: { en: "time to traverse a stated span" }
  - id: linear-rate-denominator
    kind: property-type
    label: { en: "denominator of a linear rate, over a stated span" }
    note: >
      midi2exp's decay rates are of this kind. They coincide with a traversal time only if
      the ramp is genuinely linear, which the roll says it is not.
  - id: peak-rate
    kind: property-type
    label: { en: "peak rate of the drawn line" }
  - id: lead-over-punches
    kind: property-type
    label: { en: "how far the drawn line leads the punch that names the feature" }
  - id: flow-exponent
    kind: property-type
    label: { en: "exponent α in the fitted flow law" }

  - id: blocks-in-directions
    kind: property-type
    label: { en: "the directions in which a stop blocks travel" }
  - id: latching-behaviour
    kind: property-type
    label: { en: "whether a control latches or acts only while its perforation is open" }
  - id: records
    kind: property-type
    label: { en: "what a drawn line records" }
  - id: controls-function
    kind: property-type
    label: { en: "the expression function a tracker-bar line controls" }
  - id: roll-line
    kind: property-type
    label: { en: "the tracker-bar line a function occupies" }
  - id: wider-than
    kind: property-type
    enumerable: true
    label: { en: "is of larger bore than" }
  - id: adjusted-at
    kind: property-type
    enumerable: true
    label: { en: "the adjuster that norms this quantity" }
  - id: normed-by-control
    kind: property-type
    enumerable: true
    label: { en: "the Skalarolle control that norms this quantity" }
  - id: perforation-diameter
    kind: property-type
    label: { en: "diameter of a punched perforation" }
  - id: tracker-bore-diameter
    kind: property-type
    label: { en: "diameter of a tracker-bar bore" }
  - id: roll-width
    kind: property-type
    label: { en: "width of the paper" }
  - id: correlation
    kind: property-type
    label: { en: "correlation coefficient r" }
  - id: correlation-note-locked-residual
    kind: property-type
    part_of: correlation
    label: { en: "residual note-locked dip once expression events are excluded" }
  - id: correlation-with-note-density
    kind: property-type
    part_of: correlation
    label: { en: "correlation of the line's resting position with note density" }
  - id: held-out-error
    kind: property-type
    label: { en: "held-out RMSE against the drawn line" }
  - id: share-of-squared-error
    kind: property-type
    label: { en: "share of a half's squared error" }
  - id: fraction-of-punches-redundant
    kind: property-type
    label: { en: "share of on-punches that would be redundant under a latching reading" }
  - id: parameter-value
    kind: property-type
    label: { en: "the value a model parameter is set to" }
  - id: has-stated-provenance
    kind: property-type
    label: { en: "whether the source states where a value came from" }

  # -- concepts a proposition can point at -------------------------------------

