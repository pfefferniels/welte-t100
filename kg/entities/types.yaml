  # -- historical relations, each naming the CIDOC CRM property it stands for ---
  #
  # `crm_property` is what makes the adopted layer real CRM rather than a private
  # vocabulary: the reified proposition keeps the S9 Property Type for provenance, and the
  # plain triple derived from it uses the CRM property named here. The build refuses any
  # name not declared in the vendored CIDOC CRM 7.1.3.

  - id: carried-out-by
    kind: property-type
    enumerable: true
    crm_property: P14_carried_out_by
    label: { en: "was carried out by" }
  - id: date-of
    kind: property-type
    crm_property: P4_has_time-span
    label: { en: "happened during" }
  - id: took-place-at
    kind: property-type
    crm_property: P7_took_place_at
    label: { en: "took place at" }
  - id: has-produced
    kind: property-type
    crm_property: P108_has_produced
    label: { en: "produced" }
  - id: performs-work
    kind: property-type
    crm_property: P16_used_specific_object
    label: { en: "was a performance of" }
  - id: current-location
    kind: property-type
    crm_property: P55_has_current_location
    label: { en: "is now kept at" }
  - id: depicts
    kind: property-type
    enumerable: true
    crm_property: P138_represents
    label: { en: "represents" }
    note: >
      For a plate or a figure. A scan of the roll does not represent it in this sense, it
      used it, which is `used-specific-object`; and a model of the mechanism is `models`.
  - id: models
    kind: property-type
    label: { en: "is a model of" }
    note: >
      No `crm_property`. CIDOC CRM has nothing for a scientific model standing for the
      system it simulates, and P138 is for visual items. A project property, declared as
      one, so that a decoder, an emulator and a plate are not all "representations".
  - id: has-type
    kind: property-type
    enumerable: true
    crm_property: P2_has_type
    label: { en: "is of type" }
    note: >
      For a classification a witness makes, as against the `instance_of` an entity file
      declares. The catalogue typing roll 3309 as a red roll is a claim with a locator.
  - id: is-about
    kind: property-type
    enumerable: true
    crm_property: P129_is_about
    label: { en: "has as its subject" }
  - id: refers-to
    kind: property-type
    enumerable: true
    crm_property: P67_refers_to
    label: { en: "refers to" }
  - id: defined-in
    kind: property-type
    enumerable: true
    crm_property: P67i_is_referred_to_by
    label: { en: "is a symbol defined in" }
    note: >
      A parameter is a concept; the file that sets it is the information object that
      refers to it. That is all CIDOC CRM can say about a named constant in a program,
      and it is enough to walk from a number to the code that carries it.
  - id: documented-in
    kind: property-type
    enumerable: true
    crm_property: P70i_is_documented_in
    label: { en: "is documented in" }
  - id: intended-for
    kind: property-type
    crm_property: P103_was_intended_for
    label: { en: "was intended for" }
  - id: used-specific-object
    kind: property-type
    enumerable: true
    crm_property: P16_used_specific_object
    label: { en: "used" }
    note: >
      An activity and the thing it was done with or to: a measuring campaign and the
      instrument it was made on, a scan and the roll it was made of, a study and the
      machines it worked from.
  - id: resides-at
    kind: property-type
    enumerable: true
    crm_property: P74_has_current_or_former_residence
    label: { en: "resides or resided at" }
  - id: former-owner
    kind: property-type
    crm_property: P51_has_former_or_current_owner
    label: { en: "was owned by" }
  - id: current-owner
    kind: property-type
    crm_property: P52_has_current_owner
    label: { en: "is owned by" }
  - id: current-keeper
    kind: property-type
    crm_property: P50_has_current_keeper
    label: { en: "is kept by" }
  - id: member-of
    kind: property-type
    enumerable: true
    crm_property: P107i_is_current_or_former_member_of
    label: { en: "is or was a member of" }
  - id: louder-than
    kind: property-type
    enumerable: true
    crm_property: O28_is_conceptually_greater_than
    label: { en: "is louder than" }
    note: >
      CRMsci's ordering of types, which is what a dynamic ladder is: the states are ordered
      without any of them having to carry a value, and the property is transitive.
  - id: composed-by
    kind: property-type
    label: { en: "was composed by" }
    note: >
      No `crm_property`. Doing this properly in CIDOC CRM means an E65 Creation carried out
      by the composer, and no source to hand dates or places one for this work. The
      shortcut is recorded as a shortcut rather than dressed up as a modelled event.

