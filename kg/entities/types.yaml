    label: { en: "momentary: acts only while the perforation is open" }
  - id: momentary-with-decay
    kind: concept
    label: { en: "momentary with a decaying hold" }
    note: >
      The testable middle position: a hold circuit that leaks gives per-pulse behaviour with
      an effective pulse longer than the punched perforation.
  - id: bellows-stays-put
    kind: concept
    label: { en: "the valve closes but nothing returns the bellows" }
    note: >
