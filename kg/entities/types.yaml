      bellows and that path's target, per second, at unit distance.
  - id: hook-arrest-face
    kind: property-type
    concerns: [state-mezzoforte]
    label: { en: "which face of the pin a falling bellows comes to rest on" }
  - id: upper-face
    kind: concept
    label: { en: "the pin's upper face, one half-thickness above its centre" }
  - id: lower-face
    kind: concept
    label: { en: "the pin's lower face, one half-thickness below its centre" }
  - id: arrests
    kind: property-type
    concerns: [state-mezzoforte]
    label: { en: "arrests the travel of" }
    note: >
      Distinct from `actuates`: the pin does not drive the Nuancierbalg anywhere, it stops it
      where it is. Hagmann calls it interrupting the opening or the closing, and the model
      treats it as a limit and never as a source of motion.
  - id: suction-system
    kind: concept
    label: { en: "a closed system the blower draws air out of, in which admitted air moves things" }
    note: >
      The principle the whole mechanism rests on, and the one a picture of it most needs to
      convey. The system stands at low pressure; a perforation lets ordinary atmospheric air
      in; that inrush is what moves a membrane. So on a suction line air travels towards the
      blower, against the direction in which the causation is usually described.

  # -- added while authoring Brougher ------------------------------------------
  #
  # Brougher regulates against the delivered vacuum where every other witness here works in
  # bellows travel, on paper or in MIDI velocity. That is a fourth axis, so his mezzoforte
  # gets a fourth narrower term rather than joining the three already under
  # mf-position-on-scale. Converting between them is the argument the project cannot yet
  # make.

  - id: source-kind-regulating-guide
    kind: concept
    label: { en: "a rebuilder's regulating guide, self-published on the web" }

  - id: vacuum-fraction
    kind: unit
    label: { en: "fraction of the maximum stack vacuum" }
    note: >
      Kept apart from travel-fraction and velocity-span-fraction for the same reason those
      two are kept apart. A fraction of delivered vacuum becomes a fraction of bellows
      travel only through the cone valve's characteristic, which no source in this graph
      measures; Hagemann's dome-travel figures give one point of it and no more.
  - id: pound-force-per-inch
    kind: unit
    label: { en: "lbf per inch of extension" }
    note: "Brougher's unit for the expression regulator's extension spring, over a stated inch."
  - id: roll-tempo-number
    kind: unit
    label: { en: "roll tempo number" }
    note: >
      The number marked on a roll and set on the transport. The usual player-piano
      convention is that it is ten times the paper speed in feet per minute, but Brougher
      states only the number, so the graph records only the number.

  - id: state-expression-fully-closed
    kind: concept
    label: { en: "the expression pneumatic held fully closed by hand" }
    note: >
      A bench condition rather than a commanded state, and not the same as Fortissimo:
      Hagemann's Fortissimo is Crescendo plus Forte at -355.6 mm WS while his blower runs at
      -400 to -457.2, so on his instrument the commanded maximum is short of full closure.
  - id: bare-metal-right-angle
    kind: concept
    label: { en: "a square hook and an unpadded blade, both bare metal" }
  - id: lock-valve-and-cancel-pouch
    kind: concept
    label: { en: "a guided stem with a lock valve and a cancel pouch, the lock valve permanently bled to atmosphere" }
  - id: regulated-asymmetric
    kind: concept
    label: { en: "regulated so that opening and closing take different times" }

  - id: vacuum-at-full-closure
    kind: property-type
    concerns: [state-expression-fully-closed]
    part_of: vacuum-at-tone-pneumatic
    label: { en: "vacuum at the stack with the expression pneumatic fully closed" }
  - id: first-intensity-return-tolerance
    kind: property-type
    concerns: [state-piano]
    label: { en: "how far the stack may miss its set first intensity on returning to it" }
    note: >
      A regulating tolerance, not a level. It is the closest thing in the literature to a
      stated repeatability requirement for the mechanism, which is worth having beside the
      repeatability floor this project measures on the drawn line.
  - id: mf-position-on-stack-vacuum
    kind: property-type
    concerns: [state-mezzoforte]
    part_of: mf-position-on-scale
    label: { en: "where mezzoforte sits as a fraction of the maximum stack vacuum" }
  - id: hook-capture-vacuum-difference
    kind: property-type
    concerns: [state-mezzoforte]
    label: { en: "difference in stack vacuum between the blade blocked by the hook and captured under it" }
    note: >
      The two arrest levels measured in vacuum instead of on paper. Its own property type
      because it is a difference of magnitudes and not a level, so it carries no sign.
  - id: hook-and-blade-surface
    kind: property-type
    concerns: [state-mezzoforte]
    label: { en: "the surface and angle the hook and blade must be kept in" }
    note: >
      Separate from hook-geometry, which answers what shape the stop is. A square unpadded
      hook and a plain downward finger are compatible answers to two different questions,
      and merging them would put a disagreement in the register where there is none.
  - id: decrescendo-leak-is-permanent
    kind: property-type
    concerns: [state-slow-decrescendo]
    label: { en: "whether the decrescendo throttle leaks to atmosphere at all times, including while the crescendo draws" }
  - id: valve-construction
    kind: property-type
    label: { en: "how an expression valve is built" }
  - id: valve-bleed-diameter
    kind: property-type
    label: { en: "diameter of the bleed hole in an expression valve" }
  - id: valve-travel
    kind: property-type
    label: { en: "mechanical travel a valve is set to open through" }
    note: >
      A gap in millimetres, and not the model's valve-lift band, which is the fraction of a
      port opening over which conductance rises from nothing to full. Same part, two
      different quantities.
  - id: spring-rate
    kind: property-type
    label: { en: "rate of the expression regulator's extension spring, over a stated inch" }
  - id: roll-tempo
    kind: property-type
    label: { en: "the tempo the transport is set to for a test" }

  - id: number-drill-gauge
    kind: logic
    inference_class: S6_Data_Evaluation
    label: { en: "read a number-drill size off the standard gauge table" }
    note: >
      #70 is 0.0280 in, so 0.7112 mm. A table lookup rather than arithmetic on anything the
      source states, which is why it is its own logic: the figure is only as good as the
      assumption that a rebuilder writing "#70s" means the number-drill series.

  # -- added while authoring Phillips 2016 -------------------------------------
  #
  # Phillips times the expression pneumatic over its whole stroke, where Brougher, midi2exp
  # and the roll all time it from the piano rail to the Mezzoforte hook. Those are different
  # spans, so the full-stroke figures get their own narrower terms rather than joining a
  # register they would only appear to disagree with.

  - id: traversal-time-fast-crescendo-full-stroke
    kind: property-type
    concerns: [state-fast-crescendo]
    part_of: traversal-time
    label: { en: "time for the fast crescendo to cross the whole stroke, zero to maximum" }
  - id: traversal-time-fast-decrescendo-full-stroke
    kind: property-type
    concerns: [state-fast-decrescendo]
    part_of: traversal-time
    label: { en: "time for the fast decrescendo to cross the whole stroke, maximum to zero" }

  - id: speed-over-the-stroke
    kind: property-type
    label: { en: "whether the bellows crosses its stroke at one speed or slows as it nears its target" }
    note: >
      The finer question under `control-principle`. Every witness in this graph agrees that
      the control selects rates rather than levels; they do not agree on whether a selected
      rate is constant. Kept apart so that agreement on the first is not read as agreement on
      the second.
  - id: position-to-vacuum-relation
    kind: property-type
    label: { en: "whether the delivered vacuum is an exact function of the bellows position" }
    note: >
      The premise every emulation of this mechanism rests on, and the one no source in the
      graph measures across the stroke. Hagemann's dome travel gives a single point of it.
  - id: velocity-suction-relation
    kind: property-type
    label: { en: "the shape of the relation between applied vacuum and MIDI velocity" }
    note: >
      Distinct from `position-to-vacuum-relation`: this one is the note pneumatic and the
      hammer, that one the expression regulator and the cone valve. Composing them is what
      turns a bellows position into a velocity, and the two must be able to be wrong
      separately.
  - id: minimum-reliable-vacuum
    kind: property-type
    part_of: vacuum-at-tone-pneumatic
    label: { en: "lowest stack vacuum at which the note pneumatics still play reliably" }
    note: >
      A floor on playability rather than a regulated level, which is why it is not one of the
      named states. It is worth having beside them because it says how much of the soft end
      of the ladder is usable.
  - id: paper-speed
    kind: property-type
    label: { en: "speed of the paper past the glide block" }
    note: >
      The conversion between roll distance and time, and so between every duration measured
      off a roll and every duration measured with a watch on an instrument.

  - id: metre-per-minute
    kind: unit
    label: { en: "m/min" }
    note: "Phillips's unit for paper speed. He gives 9.84 ft/min for the same figure."

  - id: constant-speed
    kind: concept
    label: { en: "one speed over the whole stroke" }
  - id: approaches-a-target
    kind: concept
    label: { en: "a rate that falls away as the bellows nears its target" }
  - id: exact-function-of-position
    kind: concept
    label: { en: "an exact function of position, possibly non-linear at the extremes of travel" }
  - id: logarithmic-in-vacuum
    kind: concept
    label: { en: "logarithmic: equal steps of vacuum buy less velocity the louder it gets" }
  - id: styli-on-pneumatics-at-the-regulators
    kind: concept
    label: { en: "styli on pneumatics connected to the bass and treble expression regulators" }
  - id: pneumatic-pianos-generally
    kind: concept
    label: { en: "pneumatic player and reproducing pianos in general, no one type" }
    note: >
      A scope and not a type. Phillips's suction-to-velocity work was done on a bench rig
      playing a Disklavier, with pneumatics shaped after Ampico and Welte practice, so its
      results are about note pneumatics and hammers rather than about the T-100.

  - id: subsumption-under-a-described-class
    kind: logic
    inference_class: S8_Categorical_Hypothesis_Building
    label: { en: "apply to a particular thing what a source says of the class it belongs to" }
    note: >
      Sound only where the thing meets the class's stated criteria and the source did not
      qualify its description. The premises must therefore include what puts the thing in the
      class, so a later reader can see the step and reject it.
  - id: scope-separation-resolves-a-disagreement
    kind: logic
    inference_class: S8_Categorical_Hypothesis_Building
    label: { en: "separate the scopes and see whether the disagreement survives" }
    note: >
      Two witnesses answering one question differently may be describing two machines. The
      test is whether a source that measured both reports the difference along the same line
      the two witnesses fall on. Where it does, the register keeps both answers and gains a
      reason for each.

  # -- added while turning the prose glosses into propositions ------------------
  #
  # Each of these replaces a sentence that used to be carried in words. Where a sentence
