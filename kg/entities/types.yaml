  # -- inference logics --------------------------------------------------------

  - id: knowledge-revision
    kind: logic
    label: { en: "knowledge revision on new evidence" }
    note: >
      The earlier belief is concluded FALSE and kept, with its argumentation, rather than
      deleted. Applied by the compiler wherever a statement declares `supersedes`.
  - id: source-criticism-t100-over-t98
    kind: logic
    label: { en: "prefer the T-100 source over a plate redrawn from a T-98 manual" }
    note: >
      Anhang 13 and Anhang 14 both carry the caption "Nach Welte 2", and Hagmann's
      bibliography (p. 256) gives Welte 2 as the Betriebsanleitung for the T-98. Anhang 12
      rests on Welte 17, the Skalarollen booklet for the T-100 (his note 53, p. 108). Where
      the two disagree about the T-100, the T-100 source is preferred.
  - id: citation-settles-what-the-roll-cannot
    kind: logic
    label: { en: "where the roll is silent, a citation may still settle the question" }
    note: >
      Applied when the roll cannot decide a parameter, or decides it only weakly, so that
      fitting it would report noise, and an external source states the answer.
  - id: composition-of-stated-mechanisms
    kind: logic
    inference_class: S8_Categorical_Hypothesis_Building
    label: { en: "compose statements the source makes separately" }
    note: >
      Each link is the source's; the conclusion is not. Used where Hagmann states three
      things about parts and the consequence for the whole follows without new assumptions.
  - id: reading-a-drawing
    kind: logic
    label: { en: "measurement off a plate at native resolution" }
    note: >
      Anhang 13 extracted with pdfimages as a 1744 × 2480 1-bit CCITT bitmap at about
      211 dpi, all coordinates in native pixels. Constrained by Hagmann's own disclaimer
      (p. 62 n. 29) that the plates are schematic and not to scale.
  - id: exponential-versus-constant-fit
    kind: logic
    inference_class: S6_Data_Evaluation
    label: { en: "compare candidate rate laws by weighted rms in the phase plane" }
  - id: differential-evolution-then-simplex
    kind: logic
    inference_class: S6_Data_Evaluation
    label: { en: "fit by differential evolution, Nelder–Mead and coordinate sweep" }
    note: >
      Alternating 8-second blocks rather than a time cut, because the model carries
      roll-length state; Huber δ = 0.06 while fitting, plain RMSE when scoring; 220
      generations; the spread across seeds reported as the error bar on the search.
      Differences below about 0.005 are the search and not the model.
  - id: ablation-refit
    kind: logic
    inference_class: S7_Simulation_or_Prediction
    label: { en: "price a term by removing it and refitting from scratch" }
    note: >
      A term whose value only pays once the drive is reshaped around it is invisible to a
      one-parameter sweep, so every variant is refitted rather than evaluated at fixed
      constants.
  - id: counting-argument-on-the-punching
    kind: logic
    inference_class: S8_Categorical_Hypothesis_Building
    label: { en: "ask what the punching would mean under the competing reading" }
    note: >
      If a reading makes several hundred deliberately cut perforations do nothing, that
      counts against it, on the assumption that the editor was not cutting holes to no
      purpose.
  - id: absence-in-a-searched-index
    kind: logic
    label: { en: "a clean negative from a searched index and read chapters" }
    note: >
      Recorded with what was searched, so the negative can be overturned by naming
      something that was not.
  - id: arithmetic
    kind: logic
    inference_class: S6_Data_Evaluation
    label: { en: "arithmetic on values the sources state" }

  # -- added while authoring Hagmann 1984 --------------------------------------

  - id: roll-line-treble
    kind: property-type
    concerns: [half-treble]
    part_of: roll-line
    label: { en: "the treble tracker-bar line a function occupies" }
  - id: roll-line-bass
    kind: property-type
    concerns: [half-bass]
    part_of: roll-line
    label: { en: "the bass tracker-bar line a function occupies" }
  - id: opening-and-closing-agency
    kind: property-type
    label: { en: "what opens and what closes a bellows" }
  - id: opening-closing-symmetry
    kind: property-type
    label: { en: "whether opening and closing are regulated to take the same time" }
  - id: acts-on
    kind: property-type
    enumerable: true
    label: { en: "the quantity a part acts on" }
  - id: sets-also
    kind: property-type
    enumerable: true
    label: { en: "the function a control also sets when it is set" }

  - id: air-and-spring-open-suction-closes
    kind: concept
    label: { en: "opened by inflowing air and an internal spring, closed by suction" }
    note: >
      The asymmetry the model turns on: closing scales with the supply vacuum, reopening
      runs off atmosphere and the spring and does not.
  - id: designed-symmetric
    kind: concept
    label: { en: "regulated so that opening takes the same elapsed time as closing" }

  - id: t98-function-sforzando
    kind: concept
    label: { en: "T-98 opening 67, sudden crescendo (Sforzando Forte)" }
    note: >
      The T-98 has four nuancing openings a half rather than six, because Crescendo and
      Mezzoforte take their input and its cancellation through a single opening. Given its
      own concept rather than shared with the T-100 control, because they are not the same
      device and Hagmann describes them differently.
  - id: t98-function-mezzoforte
    kind: concept
    label: { en: "T-98 opening 65, Mezzoforte" }
  - id: code-symbol
    kind: concept
    label: { en: "identifier of a symbol in the project's source code" }

  # -- added while authoring Anhang 12, Anhang 13, Gottschewski and the two ports

  - id: control-principle
    kind: property-type
    label: { en: "the principle on which loudness is controlled" }
  - id: hook-geometry
    kind: property-type
    label: { en: "the shape of the Mezzoforte stop" }
  - id: drawing-is-independent-evidence
    kind: property-type
    label: { en: "whether a feature of a plate is independent evidence about the machine" }
    note: >
      Needed because a hand-drawn plate can repeat a module, in which case the third copy of
      a feature testifies to the draughtsman's hand and not to the mechanism.
  - id: derives-from
    kind: property-type
    enumerable: true
    crm_property: P130_shows_features_of
    label: { en: "the source a work is derived from" }
    note: >
      Recorded so that agreement by descent is never counted as corroboration. Two
      implementations that share an ancestor are one witness. P130 is CIDOC CRM's own
      generalisation of "copy of" and "derived from", with the derivative as the domain.

  - id: rates-not-levels
    kind: concept
    label: { en: "switchable rates of change, not selectable levels" }
  - id: downward-finger
    kind: concept
    label: { en: "a plain downward finger of finite thickness" }
    note: >
      As against a notch. A notch confines the bellows to a band; a finger gives two arrest
      levels a thickness apart, whichever face is met.
  - id: hook-position-is-adjustable
    kind: concept
    label: { en: "adjustable in regulation rather than fixed by construction" }

  # -- added while authoring the roll observations and the fit -----------------
  #
  # Each state gets its own narrower term under time-constant, asymptote and
  # traversal-time. The reason is the same in every case: two states of the same mechanism
  # have different values for the same kind of quantity, and merging them under one
  # property type would make the graph report a disagreement where there is none.

  - id: time-constant-slow-crescendo
    kind: property-type
    concerns: [state-crescendo]
    part_of: time-constant
    label: { en: "time constant of the slow crescendo" }
  - id: time-constant-slow-decrescendo
    kind: property-type
    concerns: [state-slow-decrescendo]
    part_of: time-constant
    label: { en: "time constant of the slow decrescendo, the default state" }
  - id: asymptote-slow-crescendo
    kind: property-type
