  - id: air-pulse
    kind: concept
    label: { de: "Luftstoß", en: "a pulse of air, not a steady level" }
    note: >
      What the relay membranes respond to. Bore 37 is dimensioned to establish the working
      vacuum but not to neutralise the pulse, so the valve trips on a rate of change.
  - id: gleitblock-opening-7
    kind: component
    part_of: gleitblock
    label: { de: "Öffnung 7 (Mezzoforte ab)", en: "glide-block opening 7, Mezzoforte off" }
    note: >
      The outermost of the six on the Discant side, and the one the drawing did without until
      it was noticed that the hook could be put in and never taken out. Hagmann's note 27
      explains why the cancelling opening is outermost: a slight lateral drift of the paper
      then cancels Mezzoforte rather than triggering something.
