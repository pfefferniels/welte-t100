# Instruments, rolls, mechanism components and the texts that carry the evidence.
#
# A component record names a part of the T-100 design by Hagmann's drawing number. Where a
# claim is about one machine — Hagemann's Ibach, Hagmann's two instruments in Seewen — the
# subject is that instrument, and the graph will not silently promote it to the type.

entities:

  # -- instrument types --------------------------------------------------------

  - id: welte-t100
    kind: concept
    label: { en: "Welte-Mignon T-100 (the red rolls)" }
    note: >
      The 100-hole scale. Six expression lines a half, plus Hammerleiste and Widerstand in
      the bass and Pedal in the treble.
  - id: welte-t98
    kind: concept
    label: { en: "Welte-Mignon T-98 (the green rolls)" }
    note: >
      Present in this graph only because Anhang 13 and Anhang 16, the plates for the T-100,
      are both captioned "Nach Welte 2", a T-98 Betriebsanleitung. Anything read off them is
      a T-98 reading until argued otherwise.
  - id: welte-licensee
    kind: concept
    label: { en: "Welte-Mignon Licensee" }
    note: >
      The American-built licensee instrument. Present in this graph only because Brougher's
      regulating procedure covers it together with the Original, and mostly without saying
      which of the two a figure is meant for.
  - id: welte-licensee-and-original
    kind: concept
    label: { en: "the Licensee and the Original Welte-Mignon, undistinguished" }
    note: >
      A scope rather than a type of instrument. Brougher writes one procedure for both
      machines and gives most of his figures without saying which is meant, so a claim
      scoped here must not be read as a claim about the T-100 alone. Where he does say
      "Original", the statement is scoped to welte-t100 instead.

  # -- particular machines -----------------------------------------------------

  - id: ibach-8171-21310
    kind: instrument
    instance_of: welte-t100
    label: { en: "Ibach Welte-Flügel Nr. 8171/21310" }
    note: >
      Hagemann's own instrument, into whose conduit rails between Betonungs- and
      Tonpneumatik he drilled manometer taps. Every vacuum figure in this graph is a reading
      off this machine and no other.
  - id: seewen-steinway-welte-1914
    kind: instrument
    instance_of: welte-t100
    label: { en: "Steinway-Welte grand, 1914, Museum für Musikautomaten Seewen" }
    note: "One of the two instruments Hagmann worked from."
  - id: seewen-gaveau-welte-t98
    kind: instrument
    instance_of: welte-t98
    label: { en: "Gaveau-Welte upright (T-98), Seewen" }
    note: "Hagmann's second instrument."
  - id: brougher-original-welte
    kind: instrument
    instance_of: welte-t100
    label: { en: "an Original Welte-Mignon rebuilt by Brougher, not further identified" }
    note: >
      He names no maker, serial number or date, so the spring reading taken off it cannot be
      traced to a particular machine. Given an entity all the same, because it is a
      measurement on one instrument and the graph will not promote it to the type.

  # -- rolls -------------------------------------------------------------------

  - id: roll-3309
    kind: roll
    instance_of: welte-t100
    part_of: condon-collection
    label: { en: "Welte-Mignon roll 3309, Backhaus, Schubert Militärmarsch in E♭" }
    note: >
      Recorded 1.1.1920, punched 22.11.1922. Stanford druid jq774vx6544, CONDON ROLL 776,
      from the Denis Condon collection. One of the few late rolls carrying drawn
      Handnuancierung lines.
    same_as: ["https://purl.stanford.edu/jq774vx6544"]
  - id: condon-collection
    kind: collection
    label: { en: "the Denis Condon collection of piano rolls" }
    note: >
      An E78 Curated Holding: the roll collection Stanford acquired from Denis Condon, of
      which roll 3309 is CONDON ROLL 776. Phillips read it before the sale, so this is the
      holding that his thesis and this project's roll have in common.
  - id: phillips-welte-mignon-test-roll
    kind: roll
    instance_of: welte-t100
    label: { en: "the Welte-Mignon test roll Phillips measured from, as a MIDI file" }
    note: >
      Not identified with Welte 17's Skalarolle: Phillips names no edition and says
      himself that production rolls vary. Every slow travel time in his Table 4.1 is a
      distance on this roll turned into seconds, and his analogue model was adjusted to
      satisfy its criteria.
  - id: brougher-test-roll
    kind: roll
    label: { en: "the test roll Brougher's roll tests 1 to 18 are run from" }
    note: >
      Not typed as a T-100 roll and not identified with the Skalarolle: his numbering does
      not match Welte's Kontrollen as Anhang 12 prints them, and the reading may belong to
      the Licensee. That his six-pulse strobing test is recognisably Welte's Kontrolle 4b
      is an inference held below, not an identification.
  - id: midi2exp-test-roll
    kind: roll
    label: { en: "the unnamed Welte test roll midi2exp's comments cite" }
    note: >
      Nine constants in midi2exp cite a measurement from "the test roll". No scan, druid
      or edition is given anywhere, so the roll cannot be identified and the measurements
      cannot be checked. Given an entity so that the citations have something to point at
      and the provenance assessment has something to be about.
  - id: skalarolle-t100
    kind: roll
    instance_of: welte-t100
    label: { en: "the T-100 Skalarolle (test roll)" }
    note: >
      Not extant to this project. Every nuancing duration in Anhang 12 is defined by the
      distance between marker tones on it, so scanning one would turn the whole of Welte's
      regulation procedure into seconds. It remains the single most valuable missing source.
  - id: drawn-expression-lines
    kind: concept
    label: { en: "the drawn expression lines on late Welte-Mignon rolls, as a class" }
    note: >
      Phillips reports them on rolls produced after 1922 and says what drew them. Roll 3309
      was punched in November 1922, so its two lines are an instance and the class-level
      claims reach it that way rather than by being asserted of it.
  - id: drawn-line-3309
    kind: feature
    instance_of: drawn-expression-lines
    label: { en: "the two drawn Handnuancierung lines on roll 3309" }
    part_of: roll-3309
    note: >
      An E25 Human-Made Feature, found on the roll by P56, because a line drawn on paper
      cannot be taken off it. What it physically records is the open question the whole
      project turns on. It is answered positively — bellows position, not delivered
      vacuum — on a null result rather than on any statement in the literature.
  - id: drawn-line-3309-bass
    kind: feature
    part_of: drawn-line-3309
    label: { en: "the bass Handnuancierung line on roll 3309" }
    note: >
      The two lines are separate subjects rather than one subject with a half qualifier,
      because every quantity measured off them — rails, hook level, lead, time constants,
      rates — comes out differently for the two, and the emulator fits them independently.
  - id: drawn-line-3309-treble
    kind: feature
    part_of: drawn-line-3309
    label: { en: "the treble (Discant) Handnuancierung line on roll 3309" }
  - id: phillips-bench-rig
    kind: object
    label: { en: "Phillips's bench rig: a pneumatic working a wooden finger on a Disklavier key" }
    note: >
      Where every suction-to-velocity figure in `phillips-2016` was measured: twenty-five
      suction levels from 5 to 29 inches WG, five strikes each, read against a single-tube
      manometer. Not a Welte, and the curve is the Disklavier's as much as the pneumatic's,
      which is why its readings are scoped to pneumatic pianos generally.

  # -- mechanism components, by Hagmann's drawing numbers ----------------------

  - id: nuancierbalg-90
    kind: component
    part_of: welte-t100
    label: { en: "Nuancierbalg 90" }
    note: "Closed by suction, opened by inflowing air together with its own internal spring."
  - id: mezzofortebalg-93
    kind: component
    part_of: welte-t100
    label: { en: "Mezzofortebalg and hook, 93" }
    note: >
      The Mezzoforte stop. Read off Anhang 13 as a plain downward finger rather than a
      notch, which gives two arrest levels a finger-thickness apart rather than one.
  - id: regelbalg-91
    kind: component
    part_of: welte-t100
    label: { en: "Regelbalg 91" }
    note: >
      Senses the delivered vacuum downstream of the cone valve and opens it further under
      dense playing. A genuine closed loop, and the reason mezzoforte is a fixed position of
      the Nuancierbalg rather than a fixed delivered vacuum.
  - id: kegelventil-87
    kind: component
    part_of: welte-t100
    label: { en: "cone valve 87" }
  - id: kondukte-39
    kind: component
    part_of: welte-t100
    label: { en: "conduit 39, the crescendo path" }
    note: >
      Permanently joined to the bellows, with its far end switched by the crescendo relay
      between blower vacuum and atmosphere. One path with two targets, which is why
      cancelling the crescendo turns it into a leak.
  - id: kondukte-23
    kind: component
    part_of: welte-t100
    label: { en: "conduit 23, the sforzando path" }
  - id: bohrung-100
    kind: component
    part_of: welte-t100
    label: { en: "throttled bore 100" }
    note: "Supplements conduit 39 on the reopening, so that opening takes as long as closing."
  - id: drossel-96
    kind: component
    part_of: welte-t100
    label: { en: "throttle 96, the sforzando reopening assist" }
  - id: drossel-97
    kind: component
    part_of: welte-t100
    label: { en: "throttle 97, the subito-piano vacuum dump" }
    note: >
      Admits air directly into the downstream part of wind chamber 86 and into conduits 88,
      bypassing the cone valve. During a subito piano the delivered vacuum is therefore not
      a function of the Nuancierbalg position alone.
  - id: drossel-98
    kind: component
    part_of: welte-t100
    label: { en: "throttle 98, the crescendo closing time" }
  - id: drossel-99
    kind: component
    part_of: welte-t100
    label: { en: "throttle 99, the sforzando closing speed" }
  - id: bohrung-20
    kind: component
    part_of: welte-t100
    label: { en: "bore 20, the sforzando-on valve threshold" }
  - id: bohrung-29
    kind: component
    part_of: welte-t100
    label: { en: "bore 29, the sforzando-off hold and tail" }
  - id: hilfsbalg-94
    kind: component
    part_of: welte-t100
    label: { en: "auxiliary bellows 94" }
  - id: hilfsbalg-95
    kind: component
    part_of: welte-t100
    label: { en: "auxiliary bellows 95" }
  - id: magazinbalg
    kind: component
    part_of: welte-t100
    label: { en: "magazine bellows and safety valve of the blower reservoir" }
  - id: gleitblock
    kind: component
    part_of: welte-t100
    label: { en: "the glide block (tracker bar)" }
  - id: tonpneumatik
    kind: component
    part_of: welte-t100
    label: { de: "Tonpneumatik", en: "the note pneumatics (the stack)" }
    note: >
      What the expression regulator delivers its vacuum to, and where both witnesses who put
      a gauge on a Welte put it: Hagemann taps the line between Betonungs- and Tonpneumatik,
      Brougher connects his in place of a note tube at the end of the stack. Named so that a
      stack reading has a subject that is neither the blower nor the relay's wind chamber.

  # -- Brougher's parts, named as he names them ----------------------------------
  #
  # None of these is identified with any of Hagmann's numbered parts. Brougher states that
  # the expression screws are not in the same relative position between models and cannot
  # be numbered from any drawing, so an identification would be the project's and not his.
  # They belong to the Licensee and the Original together, which is a scope and not a type,
  # and the schematic does not draw them.

  - id: forzando-valve
    kind: component
    part_of: welte-licensee-and-original
    label: { en: "the forzando valve, as Brougher names it" }
  - id: expression-regulator-brougher
    kind: component
    part_of: welte-licensee-and-original
    label: { en: "the separate throttle-type vacuum regulator for the expressions, as Brougher names it" }
    note: >
      He says it carries the large extension spring he weighed. Whether it is a distinct
      device, his name for the reservoir and its spring, or for the Regelbalg 91, is open.
  - id: brougher-screw-3
    kind: component
    part_of: welte-licensee-and-original
    label: { en: "Brougher's screw #3, the decrescendo (\"O\", crescendo off)" }
    note: "\"Just a vacuum leak to air with a screw throttle interposed\", in his words."
  - id: brougher-screw-4
    kind: component
    part_of: welte-licensee-and-original
    label: { en: "Brougher's screw #4, the crescendo (\"P\")" }
  - id: brougher-screw-6
    kind: component
    part_of: welte-licensee-and-original
    label: { en: "Brougher's screw #6, the forzando set screw" }
  - id: brougher-leather-nut-a
    kind: component
    part_of: welte-licensee-and-original
    label: { en: "Brougher's leather nut A, one per half, which sets the first intensity" }

  # -- Phillips's adjusters, named as his Figure 4.1 names them ----------------
  #
  # Four adjusters, two speeds each way. Three can be identified with Hagmann's numbered
  # parts on Welte's own word and Hagmann's; the fourth is the project's guess. The
  # identifications are statements held with a belief value, not declarations here.

  - id: phillips-adjuster-crescendo-f
    kind: component
    part_of: welte-t100
    label: { en: "Phillips's adjuster \"Crescendo F\", the slow closing speed" }
  - id: phillips-adjuster-crescendo-p
    kind: component
    part_of: welte-t100
    label: { en: "Phillips's adjuster \"Crescendo P\", the slow opening speed" }
  - id: phillips-adjuster-forz-f
    kind: component
    part_of: welte-t100
    label: { en: "Phillips's adjuster \"Forz F\", the fast closing speed" }
  - id: phillips-adjuster-forz-p
    kind: component
    part_of: welte-t100
    label: { en: "Phillips's adjuster \"Forz P\", the fast opening speed" }
  - id: kettenband
    kind: component
    part_of: welte-t100
    label: { en: "the chain band joining Nuancierbalg and Regelbalg to the cone valve" }
    note: >
      Inextensible, so the cone valve position is a sum of the two contributions; and a
      chain, so it can pull but not push.

  # -- texts, plates and code --------------------------------------------------

  # A document the project has a source file for carries `same_as` to that source's node,
  # so the thing claims are made about and the witness claims are read out of are linked
  # without being collapsed: the book is what Hagmann wrote, the source is how it is cited.

  - id: welte-2
    kind: document
    created_by: [welte-m-soehne]
    label: { en: "Welte 2: Welte-Mignon-Reproduktionsklavier [Betriebsanleitung T 98]" }
    note: >
      Hagmann's bibliography, p. 256. Not seen by this project. It matters because Anhang 13
      and Anhang 16, the T-100 plates, are captioned "Nach Welte 2".
  - id: welte-13
    kind: document
    created_by: [welte-m-soehne]
    label: { en: "Welte 13: the Skalarollen booklet for the T-98" }
    note: >
      Hagmann's note 53, p. 108, names it as a second basis of Anhang 12, for the T-98. Not
      seen by this project.
  - id: welte-17
    kind: document
    created_by: [welte-m-soehne]
    label: { en: "Welte 17: the Skalarollen booklet for the T-100" }
    note: >
      Hagmann's note 53, p. 108, gives it as the basis of Anhang 12. Not seen by this
      project. It is a T-100 source, which is the whole of the argument in §11.1 of
      signal-path.md.
  - id: welte-handbooks-phillips
    kind: document
    created_by: [welte-m-soehne]
    label: { en: "the Welte factory handbooks Phillips worked from, not further identified" }
    note: >
      He cites "Welte literature" and "factory handbooks" and names none. Given an entity
      so that his clean negative, that they give no figure for any level, has a subject.
  - id: anhang-10
    kind: document
    part_of: hagmann-1984-book
    created_by: [hagmann-peter]
    label: { en: "Hagmann 1984, Anhang 10 (p. 178): the T-100 roll line numbering" }
  - id: anhang-12
    kind: document
    part_of: hagmann-1984-book
    created_by: [hagmann-peter]
    same_as: ["https://w3id.org/welte-t100/source/welte-anhang-12"]
    label: { en: "Hagmann 1984, Anhang 12: Welte's regulation procedure for the T-100" }
    note: >
      After Welte 17 (T-100), with additions from Welte 13 (T-98) and Welte 2; those three
      descents are statements with his note 53 as locator. The Kontrollen it prints are
      declared as procedures and are its components.
  - id: anhang-13
    kind: document
    part_of: hagmann-1984-book
    created_by: [hagmann-peter]
    label: { en: "Hagmann 1984, Anhang 13 (p. 186): the T-100 Nuancierungseinrichtung plate" }
    note: >
      Captioned "Nach Welte 2", a T-98 Betriebsanleitung. Extracted with pdfimages as a
      1744 × 2480 1-bit bitmap at about 211 dpi. Its three "on" units are one hand-drawn
      module repeated at a pitch of 331 px, so the Sforzando-on hold chamber is not an
      independent observation about the sforzando.
  - id: midi2exp-source
    kind: software
    created_by: [pianoroll-project]
    label: { en: "midi2exp source, commit 8f50e78" }
    same_as:
      - "https://github.com/pianoroll/midi2exp"
      - "https://w3id.org/welte-t100/source/midi2exp"
  - id: pianolatron-source
    kind: software
    created_by: [sul-cidr]
    label: { en: "pianolatron source, branch develop, fetched 2026-08-31" }
    same_as:
      - "https://github.com/sul-cidr/pianolatron"
      - "https://w3id.org/welte-t100/source/pianolatron"
  - id: emulator-source
    kind: software
    created_by: [pfeffer-niels]
    label: { en: "the project's emulator, emulator/src" }
    note: >
      The code that carries the pneumatic model and the pinned constants. Named so that a
      parameter has a file to be defined in and the code-constants report has a subject.
  - id: hagmann-1984-book
    kind: document
    created_by: [hagmann-peter]
    same_as: ["https://w3id.org/welte-t100/source/hagmann-1984"]
    label: { en: "Hagmann 1984, the book as a whole" }
    note: >
      Named as an entity so that claims about what the book does and does not contain have
      something to be about.
  - id: gottschewski-1996-book
    kind: document
    created_by: [gottschewski-hermann]
    same_as: ["https://w3id.org/welte-t100/source/gottschewski-1996"]
    label: { en: "Gottschewski 1996, the book as a whole" }
  - id: phillips-2016-thesis
    kind: document
    created_by: [phillips-peter]
    same_as: ["https://w3id.org/welte-t100/source/phillips-2016"]
    label: { en: "Phillips 2016, the thesis as a whole" }
    note: >
      Named as an entity so that claims about what the thesis does and does not contain have
      something to be about. Its Welte expression material is Chapter 2 pp. 110–127,
      Chapter 3 pp. 175–181 and Chapter 4 pp. 209–230.
  - id: phillips-welte-decoder
    kind: concept
    label: { en: "Phillips's analogue and microprocessor models of the Welte expression regulator" }
    note: >
      An analogue electronic circuit, later reimplemented on an Atmega32, whose output
      voltage stands for the position of the expression pneumatic. Every timing in Tables 4.1
      to 4.3 was read off this model on an oscilloscope, not off a Welte, which is why the
      model is named rather than left implicit behind the figures.
  - id: brougher-regulation-text
    kind: document
    created_by: [brougher-craig]
    same_as: ["https://w3id.org/welte-t100/source/brougher-welte-regulation"]
    label: { en: "Brougher, the regulating procedure as a whole" }
    note: >
      Named as an entity so that claims about what the nine pages do and do not contain have
      something to be about. The PDF at player-care.com is a merge of two files, a
      large-format schematic and the procedure; only the procedure is read here.
  - id: gottschewski-2024-sydney
    kind: document
    created_by: [gottschewski-hermann]
    label: { en: "Gottschewski, GPRM3 Sydney 2024, on the editing of Welte dynamics" }
    note: >
      Known to this project only as a programme entry (Session 4, "Insights to the Editing
      Process of the Dynamics and Pedalling on Welte Mignon Piano Rolls"). The video is
      available on request and is the only route to his actual words. Claims attributed to
      it here are attributed at second hand and are marked so.

  # -- Welte's Skalarollen-Kontrollen, each an E29 Design or Procedure -----------
  #
  # A control is a documented test with a pass criterion and an adjuster to turn, which is
  # what E29 is for. Each is a component of Anhang 12, and the lettered sub-controls are
  # components of the numbered one, so a part can say which control norms it.

  - id: kontrolle-2c
    kind: procedure
    part_of: anhang-12
    label: { en: "Skalarolle Kontrolle 2c: balance of bass and treble at mezzoforte" }
  - id: kontrolle-3
    kind: procedure
    part_of: anhang-12
    label: { en: "Skalarolle Kontrolle 3: the slow crescendo and decrescendo" }
  - id: kontrolle-4
    kind: procedure
    part_of: anhang-12
    label: { en: "Skalarolle Kontrolle 4: the sforzando" }
  - id: kontrolle-4a
    kind: procedure
    part_of: kontrolle-4
    label: { en: "Kontrolle 4a: four sforzando movements, opening and closing at equal speed" }
  - id: kontrolle-4b
    kind: procedure
    part_of: kontrolle-4
    label: { en: "Kontrolle 4b: six short Sforzando-on perforations walk the bellows to mezzoforte" }
  - id: kontrolle-4c
    kind: procedure
    part_of: kontrolle-4
    label: { en: "Kontrolle 4c: a long Sforzando-off brings the bellows all the way down" }
  - id: kontrolle-4d
    kind: procedure
    part_of: kontrolle-4
    label: { en: "Kontrolle 4d: a short Sforzando-off falls short of the piano position" }
  - id: kontrolle-4e
    kind: procedure
    part_of: kontrolle-4
    label: { en: "Kontrolle 4e: three short Sforzando-off perforations reach the piano position" }
  - id: kontrolle-5
    kind: procedure
    part_of: anhang-12
    label: { en: "Skalarolle Kontrolle 5: the fast forte-to-piano movement" }
  - id: kontrolle-6
    kind: procedure
    part_of: anhang-12
    label: { en: "Skalarolle Kontrolle 6: the sforzando against the automatic decrescendo" }
  - id: kontrolle-6b
    kind: procedure
    part_of: kontrolle-6
    label: { en: "Kontrolle 6b: five short Sforzando-on perforations each reach forte" }
  - id: kontrolle-6c
    kind: procedure
    part_of: kontrolle-6
    label: { en: "Kontrolle 6c: nine Sforzando on-off pairs hold mezzoforte" }

