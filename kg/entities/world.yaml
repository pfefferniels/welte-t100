# The historical world the statements are about: people, places, works and the events that
# connect them.
#
# An event is declared here only as existing and being of a kind. When it happened, where,
# and who carried it out are statements with locators, so that the CIDOC CRM in the adopted
# layer is derived from beliefs rather than asserted alongside them. That is why these
# records look so bare: everything that could be got wrong lives in `sources/`.

entities:

  # -- places ------------------------------------------------------------------

  - id: freiburg-im-breisgau
    kind: place
    label: { de: "Freiburg im Breisgau", en: "Freiburg im Breisgau" }
    note: "Where M. Welte & Söhne built the instruments and cut the rolls."
  - id: seewen
    kind: place
    label: { de: "Seewen SO", en: "Seewen, Switzerland" }
    note: >
      Museum für Musikautomaten, where the two instruments Hagmann worked from are kept.
  - id: stanford
    kind: place
    label: { en: "Stanford, California" }

  # -- people and firms --------------------------------------------------------

  - id: backhaus-wilhelm
    kind: person
    label: { en: "Wilhelm Backhaus (1884–1969)" }
    note: >
      The pianist whose playing roll 3309 records. Dates as given in the Stanford catalogue
      record; this graph has taken no independent view of them.
  - id: schubert-franz
    kind: person
    label: { en: "Franz Schubert (1797–1828)" }
  - id: condon-denis
    kind: person
    label: { en: "Denis Condon" }
    note: "The collector whose roll collection Stanford acquired."
  - id: ibach
    kind: group
    label: { de: "Rud. Ibach Sohn", en: "Ibach (piano makers)" }
  - id: steinway
    kind: group
    label: { en: "Steinway & Sons" }
  - id: gaveau
    kind: group
    label: { en: "Gaveau" }
  - id: museum-seewen
    kind: group
    label: { de: "Museum für Musikautomaten Seewen", en: "Museum für Musikautomaten, Seewen" }
  - id: stanford-libraries
    kind: group
    label: { en: "Stanford University Libraries" }
    note: >
      Holder of the Condon collection, and the maker of the scan this project works from.
      Also the home of the SUPRA archive and of both open-source emulators in this graph.

  # -- works -------------------------------------------------------------------

  - id: militaermarsch-es-dur
    kind: work
    label:
      de: "Militärmarsch in Es-Dur"
      en: "Militärmarsch in E♭ major"
    note: >
      The piece Backhaus plays on roll 3309. Given as a work so that the performance can
      refer to it; this graph makes no claim about which of Schubert's marches it is, since
      the catalogue record does not say.

  # -- events ------------------------------------------------------------------

  - id: performance-backhaus-1920
    kind: performance
    label: { en: "Backhaus plays the Militärmarsch for Welte" }
    note: >
      The playing that roll 3309 records. Kept distinct from the punching of the roll two
      years later, because between the two lies the editing that this whole project is about:
      the drawn nuancing line was made at one of those moments and turned into perforations
      at the other.
  - id: production-3309
    kind: production
    label: { en: "the punching of roll 3309" }
  - id: digitisation-3309
    kind: activity
    label: { en: "the scanning of roll 3309 at Stanford" }
    note: >
      Produced the images and the SUPRA raw MIDI this project reads. Its own date is not
      recorded here because no source to hand gives one.
  - id: hagemann-measurement-campaign
    kind: activity
    label: { en: "Hagemann's vacuum measurements on his Ibach Welte-Flügel" }
    note: >
      "Viele Tausend Druckmessungen", made through lead tubes glued into holes drilled in the
      conduit rails between Betonungs- and Tonpneumatik, with the test roll "Skala" halted
      over each perforation in turn. The individual readings in `hagemann-2001` are its
      results.
  - id: hagmann-study-seewen
    kind: activity
    label: { en: "Hagmann's examination of the two Welte instruments in Seewen" }
    note: >
      The work behind the chapter on the Nuancierungseinrichtung. Which two machines it
      used is his note 23, and is a statement.
  - id: production-ibach-8171
    kind: production
    label: { en: "the making of the Ibach Welte-Flügel Nr. 8171/21310" }
    note: >
      Two makers and two serial numbers: the piano is Ibach's, the Welte action is Welte's.
      CIDOC CRM has no shortcut from a thing to its maker, so the makers are participants in
      this event rather than a property of the instrument.
  - id: production-seewen-steinway
    kind: production
    label: { en: "the making of the Seewen Steinway-Welte grand of 1914" }
  - id: production-seewen-gaveau
    kind: production
    label: { en: "the making of the Seewen Gaveau-Welte upright" }
